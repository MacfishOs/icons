<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="ql-base-shadow" x="-15%" y="-10%" width="130%" height="135%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#021C08" flood-opacity="0.28" />
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#021C08" flood-opacity="0.14" />
    </filter>
    <filter id="ql-elem-shadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#010E04" flood-opacity="0.35" />
    </filter>

    <linearGradient id="ql-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#41CD52" />
      <stop offset="50%" stop-color="#21A034" />
      <stop offset="100%" stop-color="#0E6B20" />
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="url(#ql-bg)" filter="url(#ql-base-shadow)" />

  <g transform="translate(256, 256) scale(0.82) translate(-256, -256)" filter="url(#ql-elem-shadow)">
    <!-- Speech Bubble 1: Latin 'A' -->
    <path d="M 120 160 C 120 134, 142 112, 168 112 H 272 C 298 112, 320 134, 320 160 V 224 C 320 250, 298 272, 272 272 H 204 L 148 304 V 272 H 168 C 142 272, 120 250, 120 224 Z"
          fill="#FFFFFF" stroke="#21A034" stroke-width="2" />
    <text x="216" y="214" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" fill="#21A034" text-anchor="middle">A</text>

    <!-- Speech Bubble 2: Asian Character '文' -->
    <g transform="translate(72, 96)">
      <path d="M 120 160 C 120 134, 142 112, 168 112 H 272 C 298 112, 320 134, 320 160 V 224 C 320 250, 298 272, 272 272 H 204 L 148 304 V 272 H 168 C 142 272, 120 250, 120 224 Z"
            fill="#0E6B20" stroke="#FFFFFF" stroke-width="2.5" />
      <text x="220" y="214" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" fill="#FFFFFF" text-anchor="middle">文</text>
    </g>
  </g>

  <!-- Outer Squircle Rim Highlight -->
  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="3" />
</svg>
