<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="bp-base-shadow" x="-15%" y="-10%" width="130%" height="135%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#1A0A00" flood-opacity="0.32" />
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1A0A00" flood-opacity="0.16" />
    </filter>
    <filter id="bp-elem-shadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#FF5500" flood-opacity="0.40" />
    </filter>

    <linearGradient id="bp-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#262220" />
      <stop offset="50%" stop-color="#161413" />
      <stop offset="100%" stop-color="#0A0908" />
    </linearGradient>

    <linearGradient id="bp-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB300" />
      <stop offset="50%" stop-color="#FF6D00" />
      <stop offset="100%" stop-color="#E64A00" />
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="url(#bp-bg)" filter="url(#bp-base-shadow)" />

  <g transform="translate(256, 256) scale(0.76) translate(-256, -256)" filter="url(#bp-elem-shadow)">
    <!-- Security Target Rings -->
    <circle cx="256" cy="256" r="162" fill="none" stroke="#FF6D00" stroke-opacity="0.20" stroke-width="2" stroke-dasharray="16 12" />

    <!-- 3D Neon Burp "B" Emblem -->
    <path d="M 160 112 H 280 C 330 112, 362 142, 362 188 C 362 222, 340 244, 308 252 C 348 260, 372 286, 372 328 C 372 378, 334 400, 276 400 H 160 Z"
          fill="url(#bp-orange)" stroke="#FFE082" stroke-width="3" />

    <!-- Inner Cutouts of 'B' -->
    <rect x="216" y="156" width="76" height="56" rx="16" fill="#161413" />
    <rect x="216" y="296" width="86" height="58" rx="16" fill="#161413" />

    <!-- Specular Highlight Sheen -->
    <ellipse cx="236" cy="136" rx="64" ry="16" fill="#FFFFFF" opacity="0.3" />
  </g>

  <!-- Outer Squircle Rim Highlight -->
  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="3" />
</svg>
