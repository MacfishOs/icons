<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="em-base-shadow" x="-15%" y="-10%" width="130%" height="135%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#241400" flood-opacity="0.28" />
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#241400" flood-opacity="0.14" />
    </filter>
    <filter id="em-elem-shadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1A0E00" flood-opacity="0.30" />
    </filter>

    <linearGradient id="em-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB300" />
      <stop offset="50%" stop-color="#FF8F00" />
      <stop offset="100%" stop-color="#E65100" />
    </linearGradient>

    <linearGradient id="em-face" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9C4" />
      <stop offset="40%" stop-color="#FFEE58" />
      <stop offset="100%" stop-color="#FDD835" />
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="url(#em-bg)" filter="url(#em-base-shadow)" />

  <g transform="translate(256, 256) scale(0.78) translate(-256, -256)" filter="url(#em-elem-shadow)">
    <!-- 3D Glowing Emoji Orb -->
    <circle cx="256" cy="256" r="148" fill="url(#em-face)" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="3" />

    <!-- Top Specular Gloss Highlight -->
    <ellipse cx="256" cy="168" rx="88" ry="42" fill="#FFFFFF" opacity="0.32" />

    <!-- Happy Eyes (curved arcs) -->
    <path d="M 188 228 C 188 204, 218 204, 218 228" fill="none" stroke="#6D4C41" stroke-width="12" stroke-linecap="round" />
    <path d="M 294 228 C 294 204, 324 204, 324 228" fill="none" stroke="#6D4C41" stroke-width="12" stroke-linecap="round" />

    <!-- Joyful Smile with Teeth & Tongue -->
    <path d="M 188 266 C 188 344, 324 344, 324 266 Z" fill="#D32F2F" stroke="#6D4C41" stroke-width="8" stroke-linejoin="round" />
    <path d="M 194 266 H 318 C 318 284, 194 284, 194 266 Z" fill="#FFFFFF" />
    <path d="M 226 312 C 238 296, 274 296, 286 312 C 274 336, 238 336, 226 312 Z" fill="#FF8A80" />

    <!-- Rosy Cheeks -->
    <circle cx="166" cy="268" r="18" fill="#FF5252" opacity="0.35" />
    <circle cx="346" cy="268" r="18" fill="#FF5252" opacity="0.35" />
  </g>

  <!-- Outer Squircle Rim Highlight -->
  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="3" />
</svg>
