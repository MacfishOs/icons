<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="ch-base-shadow" x="-15%" y="-10%" width="130%" height="135%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0A1020" flood-opacity="0.22" />
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0A1020" flood-opacity="0.10" />
    </filter>
    <filter id="ch-ring-shadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#0D192B" flood-opacity="0.22" />
    </filter>
    <clipPath id="ch-circle-clip">
      <circle cx="256" cy="256" r="156" />
    </clipPath>
    <linearGradient id="ch-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" /><stop offset="60%" stop-color="#F5F7FB" /><stop offset="100%" stop-color="#E2E7F0" />
    </linearGradient>
    <linearGradient id="ch-border" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" /><stop offset="100%" stop-color="#C2CAD6" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="ch-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5252" stop-opacity="0.95" /><stop offset="100%" stop-color="#D92121" stop-opacity="0.90" />
    </linearGradient>
    <linearGradient id="ch-yellow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE033" stop-opacity="0.95" /><stop offset="100%" stop-color="#F59E00" stop-opacity="0.90" />
    </linearGradient>
    <linearGradient id="ch-green" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00B862" stop-opacity="0.95" /><stop offset="100%" stop-color="#2EE68A" stop-opacity="0.90" />
    </linearGradient>
    <linearGradient id="ch-blue-core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4DA6FF" /><stop offset="50%" stop-color="#1A73E8" /><stop offset="100%" stop-color="#0D47A1" />
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="url(#ch-bg)" stroke="url(#ch-border)" stroke-width="3" filter="url(#ch-base-shadow)" />
  <g transform="translate(256, 256) scale(0.8) translate(-256, -256)" filter="url(#ch-ring-shadow)">
    <g clip-path="url(#ch-circle-clip)">
      <path d="M 100 100 L 100 412 L 256 412 L 324 190 Z" fill="url(#ch-green)" />
      <path d="M 256 190 L 412 190 L 412 412 L 188 412 Z" fill="url(#ch-yellow)" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="3" />
      <path d="M 100 100 L 412 100 L 412 190 L 188 310 L 100 160 Z" fill="url(#ch-red)" stroke="#FFFFFF" stroke-opacity="0.65" stroke-width="3" />
    </g>
    <circle cx="256" cy="256" r="156" fill="none" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="3" />
    <circle cx="256" cy="256" r="76" fill="#FFFFFF" filter="url(#ch-ring-shadow)" />
    <circle cx="256" cy="256" r="60" fill="url(#ch-blue-core)" />
    <ellipse cx="238" cy="234" rx="22" ry="12" transform="rotate(-30 238 234)" fill="#FFFFFF" opacity="0.45" />
  </g>
