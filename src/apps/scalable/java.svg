<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="jv-base-shadow" x="-15%" y="-10%" width="130%" height="135%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#04122E" flood-opacity="0.30" />
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#04122E" flood-opacity="0.15" />
    </filter>
    <filter id="jv-elem-shadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#020818" flood-opacity="0.35" />
    </filter>

    <linearGradient id="jv-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E4488" />
      <stop offset="50%" stop-color="#102C5E" />
      <stop offset="100%" stop-color="#061633" />
    </linearGradient>

    <linearGradient id="jv-cup" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#D0DEEE" />
    </linearGradient>

    <linearGradient id="jv-steam-red" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF3366" /><stop offset="100%" stop-color="#FF9933" />
    </linearGradient>

    <linearGradient id="jv-steam-blue" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00A2FF" /><stop offset="100%" stop-color="#40DCFF" />
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="url(#jv-bg)" filter="url(#jv-base-shadow)" />

  <g transform="translate(256, 256) scale(0.82) translate(-256, -256)" filter="url(#jv-elem-shadow)">
    <!-- Rising Steam Ribbons -->
    <!-- Steam Ribbon 1: Red -->
    <path d="M 232 96 C 248 132, 212 164, 244 200 C 220 184, 228 144, 212 120 Z" fill="url(#jv-steam-red)" />
    <!-- Steam Ribbon 2: Cyan -->
    <path d="M 284 104 C 300 144, 264 176, 296 212 C 272 196, 280 156, 264 132 Z" fill="url(#jv-steam-blue)" />

    <!-- Porcelain Coffee Cup Body -->
    <path d="M 144 212 H 340 C 340 312, 290 354, 242 354 C 194 354, 144 312, 144 212 Z" fill="url(#jv-cup)" stroke="#FFFFFF" stroke-width="3" />

    <!-- Cup Handle -->
    <path d="M 334 232 C 382 232, 382 308, 334 308" fill="none" stroke="url(#jv-cup)" stroke-width="22" stroke-linecap="round" />

    <!-- Saucer Plate -->
    <ellipse cx="242" cy="374" rx="148" ry="24" fill="#D0DEEE" stroke="#FFFFFF" stroke-width="3" />
    <ellipse cx="242" cy="374" rx="96" ry="12" fill="#9FB5CC" />
  </g>

  <!-- Outer Squircle Rim Highlight -->
  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="3" />
</svg>
