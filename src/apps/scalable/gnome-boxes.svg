<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="bx-base-shadow" x="-15%" y="-10%" width="130%" height="135%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#14062E" flood-opacity="0.30" />
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#14062E" flood-opacity="0.15" />
    </filter>
    <filter id="bx-elem-shadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#0E0421" flood-opacity="0.40" />
    </filter>

    <linearGradient id="bx-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C5CFF" />
      <stop offset="50%" stop-color="#5534E8" />
      <stop offset="100%" stop-color="#3119A8" />
    </linearGradient>

    <linearGradient id="bx-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" /><stop offset="100%" stop-color="#D9CEFF" />
    </linearGradient>
    <linearGradient id="bx-left" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9C82FF" /><stop offset="100%" stop-color="#4C2CD9" />
    </linearGradient>
    <linearGradient id="bx-right" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6F4DFF" /><stop offset="100%" stop-color="#2F13A3" />
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="url(#bx-bg)" filter="url(#bx-base-shadow)" />

  <g transform="translate(256, 256) scale(0.85) translate(-256, -256)" filter="url(#bx-elem-shadow)">
    <!-- 3D Isometric Magic Box -->
    <!-- Top Face (Opening with cyan glow) -->
    <polygon points="256,128 380,188 256,248 132,188" fill="url(#bx-top)" stroke="#FFFFFF" stroke-width="2.5" />

    <!-- Left Face -->
    <polygon points="132,188 256,248 256,388 132,328" fill="url(#bx-left)" stroke="#B3A3FF" stroke-width="1.5" />

    <!-- Right Face -->
    <polygon points="380,188 256,248 256,388 380,328" fill="url(#bx-right)" stroke="#B3A3FF" stroke-width="1.5" />

    <!-- Virtual Screen popping out of box -->
    <g transform="translate(256, 178) scale(0.7) translate(-256, -256)">
      <rect x="160" y="120" width="192" height="132" rx="20" fill="#00F5D4" stroke="#FFFFFF" stroke-width="3" filter="url(#bx-elem-shadow)" />
      <polygon points="236,160 286,186 236,212" fill="#14062E" />
    </g>
  </g>

  <!-- Outer Squircle Rim Highlight -->
  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="3" />
</svg>
