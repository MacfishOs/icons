<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="ib-base-shadow" x="-15%" y="-10%" width="130%" height="135%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#2E0414" flood-opacity="0.28" />
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#2E0414" flood-opacity="0.14" />
    </filter>
    <filter id="ib-elem-shadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1A020B" flood-opacity="0.30" />
    </filter>

    <linearGradient id="ib-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5277" />
      <stop offset="50%" stop-color="#F51D4E" />
      <stop offset="100%" stop-color="#BA002B" />
    </linearGradient>

    <linearGradient id="ib-key" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F0F4FA" />
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="url(#ib-bg)" filter="url(#ib-base-shadow)" />

  <g transform="translate(256, 256) scale(0.78) translate(-256, -256)" filter="url(#ib-elem-shadow)">
    <!-- 3D Keyboard Key Tile -->
    <rect x="116" y="116" width="280" height="280" rx="56" fill="url(#ib-key)" stroke="#FFFFFF" stroke-width="3" />

    <!-- Stylized Input Method Chinese Character '中' -->
    <g>
      <!-- Box -->
      <rect x="206" y="210" width="100" height="84" rx="16" fill="none" stroke="#F51D4E" stroke-width="18" stroke-linejoin="round" />
      <!-- Center Vertical Stroke -->
      <line x1="256" y1="164" x2="256" y2="348" stroke="#F51D4E" stroke-width="20" stroke-linecap="round" />
    </g>

    <!-- Subscript 'En' Toggle Badge -->
    <rect x="296" y="306" width="76" height="42" rx="14" fill="#1A212E" stroke="#FFFFFF" stroke-width="2" />
    <text x="334" y="336" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF" text-anchor="middle">EN</text>
  </g>

  <!-- Outer Squircle Rim Highlight -->
  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="3" />
</svg>
