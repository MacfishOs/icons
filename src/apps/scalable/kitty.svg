<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="kt-base-shadow" x="-15%" y="-10%" width="130%" height="135%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#070510" flood-opacity="0.32" />
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#070510" flood-opacity="0.16" />
    </filter>
    <filter id="kt-head-shadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <linearGradient id="kt-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#251F33" />
      <stop offset="55%" stop-color="#161220" />
      <stop offset="100%" stop-color="#0C0A12" />
    </linearGradient>

    <linearGradient id="kt-border" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF70A6" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#161220" stop-opacity="0.9" />
    </linearGradient>

    <!-- Frosted Dark Amethyst Cat Head -->
    <linearGradient id="kt-head" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#453A5E" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#221C30" stop-opacity="0.96" />
    </linearGradient>

    <!-- HarmonyOS Coral-Pink Ear Petals -->
    <linearGradient id="kt-ear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF66A3" />
      <stop offset="100%" stop-color="#FF2970" />
    </linearGradient>

    <!-- Glowing Cat Eyes -->
    <linearGradient id="kt-eye" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#70FF94" />
      <stop offset="100%" stop-color="#00D68F" />
    </linearGradient>
  </defs>

  <!-- macOS Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="url(#kt-bg)" stroke="url(#kt-border)" stroke-width="3" filter="url(#kt-base-shadow)" />

  <!-- Sculpted Kitty Head -->
  <g filter="url(#kt-head-shadow)">
    <path d="M 124 238
             L 124 134
             C 124 118, 143 110, 155 121
             L 208 170
             C 238 162, 274 162, 304 170
             L 357 121
             C 369 110, 388 118, 388 134
             L 388 238
             C 402 268, 404 306, 388 338
             C 364 384, 312 404, 256 404
             C 200 404, 148 384, 124 338
             C 108 306, 110 268, 124 238 Z" fill="url(#kt-head)" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="2.5" />

    <!-- Pink Translucent Inner Ears -->
    <polygon points="146,204 146,148 192,188" fill="url(#kt-ear)" opacity="0.88" />
    <polygon points="366,204 366,148 320,188" fill="url(#kt-ear)" opacity="0.88" />

    <!-- Glowing Emerald Eyes -->
    <ellipse cx="196" cy="268" rx="28" ry="20" transform="rotate(12 196 268)" fill="url(#kt-eye)" />
    <ellipse cx="316" cy="268" rx="28" ry="20" transform="rotate(-12 316 268)" fill="url(#kt-eye)" />

    <!-- Vertical Cat Pupils -->
    <ellipse cx="196" cy="268" rx="6" ry="14" fill="#120E1A" />
    <ellipse cx="316" cy="268" rx="6" ry="14" fill="#120E1A" />

    <!-- Cute Pink Nose Triangle -->
    <polygon points="244,308 268,308 256,322" fill="#FF5C98" />

    <!-- Terminal Prompt (>_) Whisker Detail -->
    <path d="M 142 324 L 166 338 L 142 352" fill="none" stroke="#5CE6FF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="342" y1="346" x2="370" y2="346" stroke="#5CE6FF" stroke-width="7" stroke-linecap="round" />
  </g>
</svg>