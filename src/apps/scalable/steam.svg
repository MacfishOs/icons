<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="stm-base-shadow" x="-15%" y="-10%" width="130%" height="135%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#040B1A" flood-opacity="0.32" />
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#040B1A" flood-opacity="0.16" />
    </filter>
    <filter id="stm-piston-shadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#020814" flood-opacity="0.45" />
    </filter>

    <clipPath id="stm-squircle-clip">
      <rect x="16" y="16" width="480" height="480" rx="110" ry="110" />
    </clipPath>

    <linearGradient id="stm-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#172038" />
      <stop offset="50%" stop-color="#133468" />
      <stop offset="100%" stop-color="#1B669E" />
    </linearGradient>

    <linearGradient id="stm-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#C8E2FA" />
    </linearGradient>

    <linearGradient id="stm-arm-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#78C2FF" stop-opacity="0.78" />
    </linearGradient>
  </defs>

  <!-- Full-Canvas Squircle Base (480x480 rx=110) -->
  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="url(#stm-bg)" filter="url(#stm-base-shadow)" />

  <!-- Clipped Interior with scale(1.22) -->
  <g clip-path="url(#stm-squircle-clip)">
    <g transform="translate(256, 256) scale(0.85) translate(-256, -256)" filter="url(#stm-piston-shadow)">
      <!-- Ambient Cyan Rotor Halo -->
      <circle cx="314" cy="198" r="96" fill="#00B8FF" fill-opacity="0.14" stroke="#66D9FF" stroke-opacity="0.3" stroke-width="2" />

      <!-- Connecting Translucent Piston Rod -->
      <path d="M 0 268 L 198 342 L 328 228 L 280 172 L 178 292 L 0 218 Z" fill="url(#stm-arm-glass)" />

      <!-- Upper Crank Wheel -->
      <circle cx="314" cy="198" r="68" fill="url(#stm-metal)" stroke="#FFFFFF" stroke-width="2" />
      <circle cx="314" cy="198" r="36" fill="#142C59" stroke="#85C6FF" stroke-width="4" />

      <!-- Lower Pivot Joint -->
      <circle cx="192" cy="316" r="52" fill="url(#stm-metal)" stroke="#FFFFFF" stroke-width="2" />
      <circle cx="192" cy="316" r="28" fill="#174680" />
      <circle cx="192" cy="316" r="16" fill="url(#stm-metal)" />
    </g>
  </g>

  <!-- Outer Squircle Rim Highlight -->
  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="3" />
</svg>
