<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="mp-base-shadow" x="-15%" y="-10%" width="130%" height="135%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#14021A" flood-opacity="0.30" />
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#14021A" flood-opacity="0.15" />
    </filter>
    <filter id="mp-elem-shadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#0E0114" flood-opacity="0.40" />
    </filter>

    <linearGradient id="mp-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3D0C4E" />
      <stop offset="50%" stop-color="#240530" />
      <stop offset="100%" stop-color="#100117" />
    </linearGradient>

    <linearGradient id="mp-disc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E040FB" />
      <stop offset="50%" stop-color="#AA00FF" />
      <stop offset="100%" stop-color="#651FFF" />
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="url(#mp-bg)" filter="url(#mp-base-shadow)" />

  <g transform="translate(256, 256) scale(0.75) translate(-256, -256)" filter="url(#mp-elem-shadow)">
    <!-- Playback Progress Ring -->
    <circle cx="256" cy="256" r="162" fill="none" stroke="#E040FB" stroke-opacity="0.22" stroke-width="2.5" />
    <circle cx="256" cy="256" r="162" fill="none" stroke="#FF4081" stroke-width="6" stroke-linecap="round" stroke-dasharray="320 700" />

    <!-- Luminous Central Media Core Disc -->
    <circle cx="256" cy="256" r="132" fill="url(#mp-disc)" stroke="#F5B8FF" stroke-opacity="0.75" stroke-width="2.5" />
    <ellipse cx="256" cy="180" rx="84" ry="38" fill="#FFFFFF" opacity="0.22" />

    <!-- 3D Play Triangle Glyph -->
    <path d="M 216 188 C 216 178, 226 172, 236 178 L 332 246 C 342 252, 342 264, 332 270 L 236 338 C 226 344, 216 338, 216 328 Z"
          fill="#FFFFFF" stroke="#F5B8FF" stroke-width="2" filter="url(#mp-elem-shadow)" />
  </g>

  <!-- Outer Squircle Rim Highlight -->
  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="3" />
</svg>
