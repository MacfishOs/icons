<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="kc-base-shadow" x="-15%" y="-10%" width="130%" height="135%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#001833" flood-opacity="0.30" />
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#001833" flood-opacity="0.15" />
    </filter>
    <filter id="kc-elem-shadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#001026" flood-opacity="0.35" />
    </filter>

    <linearGradient id="kc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00B4D8" />
      <stop offset="50%" stop-color="#0077B6" />
      <stop offset="100%" stop-color="#023E8A" />
    </linearGradient>

    <linearGradient id="kc-phone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" /><stop offset="100%" stop-color="#D0E8F8" />
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="url(#kc-bg)" filter="url(#kc-base-shadow)" />

  <g transform="translate(256, 256) scale(0.8) translate(-256, -256)" filter="url(#kc-elem-shadow)">
    <!-- Smartphone Frame -->
    <rect x="144" y="112" width="148" height="288" rx="36" fill="url(#kc-phone)" stroke="#FFFFFF" stroke-width="3" />
    <rect x="156" y="148" width="124" height="212" rx="14" fill="#042854" />

    <!-- Radio Waves Emission Beaming Right -->
    <path d="M 324 216 A 48 48 0 0 1 324 296" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" />
    <path d="M 358 184 A 92 92 0 0 1 358 328" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" opacity="0.8" />
    <path d="M 392 152 A 136 136 0 0 1 392 360" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" opacity="0.6" />

    <!-- Phone Screen Indicator -->
    <circle cx="218" cy="254" r="16" fill="#00B4D8" />
  </g>

  <!-- Outer Squircle Rim Highlight -->
  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="3" />
</svg>
