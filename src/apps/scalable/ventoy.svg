<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="vt-base-shadow" x="-15%" y="-10%" width="130%" height="135%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#021028" flood-opacity="0.28" />
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#021028" flood-opacity="0.14" />
    </filter>
    <filter id="vt-elem-shadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000918" flood-opacity="0.38" />
    </filter>

    <linearGradient id="vt-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E66D0" />
      <stop offset="50%" stop-color="#0D449E" />
      <stop offset="100%" stop-color="#05225E" />
    </linearGradient>

    <linearGradient id="vt-usb-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#D6E4F5" />
      <stop offset="100%" stop-color="#9EB9DC" />
    </linearGradient>

    <linearGradient id="vt-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BAC8DA" />
      <stop offset="100%" stop-color="#6E829C" />
    </linearGradient>

    <linearGradient id="vt-v" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4" />
      <stop offset="100%" stop-color="#0099FF" />
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="url(#vt-bg)" filter="url(#vt-base-shadow)" />

  <g transform="translate(256, 256) scale(0.85) translate(-256, -256)" filter="url(#vt-elem-shadow)">
    <!-- USB Plug Tip -->
    <rect x="206" y="80" width="100" height="96" rx="10" fill="url(#vt-metal)" stroke="#FFFFFF" stroke-width="2" />
    <!-- Connector Holes -->
    <rect x="226" y="104" width="20" height="24" rx="4" fill="#0A182E" />
    <rect x="266" y="104" width="20" height="24" rx="4" fill="#0A182E" />

    <!-- Flash Drive Main Casing Body -->
    <rect x="176" y="156" width="160" height="252" rx="36" fill="url(#vt-usb-body)" stroke="#FFFFFF" stroke-width="2.5" />

    <!-- Illuminated Ventoy "V" Emblem -->
    <path d="M 204 220 L 256 330 L 308 220 H 280 L 256 284 L 232 220 Z" fill="url(#vt-v)" filter="url(#vt-elem-shadow)" stroke="#00E5FF" stroke-width="1.5" />

    <!-- Activity Status LED Indicator -->
    <circle cx="256" cy="370" r="8" fill="#00F5D4" />
    <circle cx="256" cy="370" r="4" fill="#FFFFFF" />
    <circle cx="256" cy="370" r="14" fill="#00E5FF" opacity="0.3" />
  </g>

  <!-- Outer Squircle Rim Highlight -->
  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="3" />
</svg>
