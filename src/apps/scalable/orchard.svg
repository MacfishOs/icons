<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="or-base-shadow" x="-15%" y="-10%" width="130%" height="135%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#1A0205" flood-opacity="0.32" />
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1A0205" flood-opacity="0.16" />
    </filter>
    <filter id="or-elem-shadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#8B0000" flood-opacity="0.4" />
    </filter>

    <linearGradient id="or-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C21838" />
      <stop offset="50%" stop-color="#880E24" />
      <stop offset="100%" stop-color="#4A0512" />
    </linearGradient>

    <linearGradient id="or-apple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3366" />
      <stop offset="50%" stop-color="#E91E63" />
      <stop offset="100%" stop-color="#9C27B0" />
    </linearGradient>

    <linearGradient id="or-leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#76FF03" />
      <stop offset="100%" stop-color="#388E3C" />
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="url(#or-bg)" filter="url(#or-base-shadow)" />

  <g transform="translate(256, 256) scale(0.8) translate(-256, -256)" filter="url(#or-elem-shadow)">
    <!-- Vinyl Grooves Rings behind Apple -->
    <circle cx="256" cy="268" r="150" fill="none" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="2" />
    <circle cx="256" cy="268" r="130" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1.5" />

    <!-- Leaf on top -->
    <path d="M 256 128 C 286 100, 320 108, 320 108 C 320 108, 312 142, 282 170 Z" fill="url(#or-leaf)" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="2" />

    <!-- Musical Apple Core -->
    <path d="M 256 180 C 220 148, 148 160, 136 244 C 124 330, 204 380, 256 380 C 308 380, 388 330, 376 244 C 364 160, 292 148, 256 180 Z"
          fill="url(#or-apple)" stroke="#FFFFFF" stroke-width="2.5" />

    <!-- Center Play Button Triangle -->
    <circle cx="256" cy="272" r="42" fill="#FFFFFF" fill-opacity="0.2" stroke="#FFFFFF" stroke-width="2" />
    <polygon points="248,252 276,272 248,292" fill="#FFFFFF" />

    <!-- Glossy Reflection Sheen -->
    <ellipse cx="216" cy="216" rx="44" ry="24" transform="rotate(-30 216 216)" fill="#FFFFFF" opacity="0.32" />
  </g>

  <!-- Outer Squircle Rim Highlight -->
  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="3" />
</svg>
