<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="sr-base-shadow" x="-15%" y="-10%" width="130%" height="135%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#020E24" flood-opacity="0.30" />
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#020E24" flood-opacity="0.15" />
    </filter>
    <filter id="sr-elem-shadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#001838" flood-opacity="0.38" />
    </filter>

    <linearGradient id="sr-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14325C" />
      <stop offset="50%" stop-color="#0B1E38" />
      <stop offset="100%" stop-color="#040D1C" />
    </linearGradient>

    <linearGradient id="sr-lens-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#64D2FF" />
      <stop offset="100%" stop-color="#0A84FF" />
    </linearGradient>

    <linearGradient id="sr-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#47E0FF" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#0055D4" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="sr-handle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64D2FF" />
      <stop offset="100%" stop-color="#004FB8" />
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="url(#sr-bg)" filter="url(#sr-base-shadow)" />

  <g transform="translate(256, 256) scale(0.76) translate(-256, -256)" filter="url(#sr-elem-shadow)">
    <!-- Concentric Search Target Sonar Wave -->
    <circle cx="224" cy="224" r="148" fill="none" stroke="#30B0FE" stroke-opacity="0.18" stroke-width="2" stroke-dasharray="8 6" />

    <!-- 3D Glass Magnifier Handle -->
    <rect x="290" y="290" width="36" height="136" rx="18" transform="rotate(-45 290 290)" fill="url(#sr-handle)" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="2" />
    <rect x="294" y="294" width="28" height="60" rx="14" transform="rotate(-45 294 294)" fill="#FFFFFF" opacity="0.3" />

    <!-- 3D Magnifier Outer Rim -->
    <circle cx="224" cy="224" r="108" fill="url(#sr-glass)" stroke="url(#sr-lens-rim)" stroke-width="20" />

    <!-- Center Luminous Sparkle -->
    <path d="M 224 168 Q 224 224 168 224 Q 224 224 224 280 Q 224 224 280 224 Q 224 224 224 168 Z" fill="#FFFFFF" opacity="0.9" />
    <ellipse cx="196" cy="186" rx="38" ry="18" transform="rotate(-35 196 186)" fill="#FFFFFF" opacity="0.4" />
  </g>

  <!-- Outer Squircle Rim Highlight -->
  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="3" />
</svg>
