<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="qd-base-shadow" x="-15%" y="-10%" width="130%" height="135%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#021C08" flood-opacity="0.28" />
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#021C08" flood-opacity="0.14" />
    </filter>
    <filter id="qd-elem-shadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#010E04" flood-opacity="0.35" />
    </filter>

    <linearGradient id="qd-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#41CD52" />
      <stop offset="50%" stop-color="#21A034" />
      <stop offset="100%" stop-color="#0E6B20" />
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="url(#qd-bg)" filter="url(#qd-base-shadow)" />

  <g transform="translate(256, 256) scale(0.76) translate(-256, -256)" filter="url(#qd-elem-shadow)">
    <!-- UI Layout Wireframe Window Canvas -->
    <rect x="120" y="120" width="272" height="272" rx="36" fill="#FFFFFF" fill-opacity="0.16" stroke="#FFFFFF" stroke-width="3" />

    <!-- Widget Components -->
    <rect x="152" y="152" width="96" height="48" rx="14" fill="#FFFFFF" />
    <rect x="264" y="152" width="96" height="48" rx="14" fill="#FFFFFF" fill-opacity="0.6" />

    <rect x="152" y="224" width="208" height="72" rx="16" fill="#FFFFFF" fill-opacity="0.85" />

    <rect x="152" y="320" width="128" height="40" rx="12" fill="#00E5FF" />
    <circle cx="330" cy="340" r="20" fill="#FFD600" />
  </g>

  <!-- Outer Squircle Rim Highlight -->
  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="3" />
</svg>
