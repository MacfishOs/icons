<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="lm-base-shadow" x="-15%" y="-10%" width="130%" height="135%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#080210" flood-opacity="0.32" />
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#080210" flood-opacity="0.16" />
    </filter>
    <filter id="lm-elem-shadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#FF1493" flood-opacity="0.35" />
    </filter>

    <linearGradient id="lm-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#241B2E" />
      <stop offset="50%" stop-color="#140D1C" />
      <stop offset="100%" stop-color="#09050D" />
    </linearGradient>

    <linearGradient id="lm-wave" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2A85" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="url(#lm-bg)" filter="url(#lm-base-shadow)" />

  <g transform="translate(256, 256) scale(0.8) translate(-256, -256)" filter="url(#lm-elem-shadow)">
    <!-- Acoustic Sound Waves Circle -->
    <circle cx="256" cy="256" r="160" fill="none" stroke="#A855F7" stroke-opacity="0.15" stroke-width="2" />
    <circle cx="256" cy="256" r="130" fill="none" stroke="#FF2A85" stroke-opacity="0.2" stroke-width="2" />

    <!-- 3D Equalizer Acoustic Beats Bars -->
    <g fill="url(#lm-wave)">
      <rect x="146" y="240" width="24" height="80" rx="12" />
      <rect x="186" y="180" width="24" height="140" rx="12" />
      <rect x="226" y="130" width="24" height="210" rx="12" />
      <rect x="266" y="160" width="24" height="170" rx="12" />
      <rect x="306" y="210" width="24" height="120" rx="12" />
      <rect x="346" y="260" width="24" height="60" rx="12" />
    </g>

    <!-- Glowing Musical Note Badge -->
    <circle cx="340" cy="160" r="28" fill="#FF2A85" stroke="#FFFFFF" stroke-width="2.5" filter="url(#lm-elem-shadow)" />
    <path d="M 334 174 V 150 C 334 146, 344 144, 348 144 V 162" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" />
    <circle cx="330" cy="172" r="6" fill="#FFFFFF" />
  </g>

  <!-- Outer Squircle Rim Highlight -->
  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="3" />
</svg>
