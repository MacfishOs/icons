<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="tt-base-shadow" x="-15%" y="-10%" width="130%" height="135%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0E0A08" flood-opacity="0.32" />
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0E0A08" flood-opacity="0.16" />
    </filter>
    <filter id="tt-elem-shadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <linearGradient id="tt-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2E2824" />
      <stop offset="50%" stop-color="#1A1614" />
      <stop offset="100%" stop-color="#0C0A09" />
    </linearGradient>

    <linearGradient id="tt-vinyl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#282828" />
      <stop offset="50%" stop-color="#141414" />
      <stop offset="100%" stop-color="#0A0A0A" />
    </linearGradient>

    <linearGradient id="tt-label" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D32F2F" />
      <stop offset="100%" stop-color="#880E4F" />
    </linearGradient>

    <linearGradient id="tt-arm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#8A7320" />
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="url(#tt-bg)" filter="url(#tt-base-shadow)" />

  <g transform="translate(256, 256) scale(0.8) translate(-256, -256)" filter="url(#tt-elem-shadow)">
    <!-- Vinyl LP Record Disc -->
    <circle cx="236" cy="256" r="148" fill="url(#tt-vinyl)" stroke="#3E3E3E" stroke-width="2" />

    <!-- Vinyl Grooves -->
    <circle cx="236" cy="256" r="132" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="1.5" />
    <circle cx="236" cy="256" r="116" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5" />
    <circle cx="236" cy="256" r="100" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1.5" />
    <circle cx="236" cy="256" r="84" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5" />

    <!-- Light Specular Reflection Flash on Vinyl -->
    <path d="M 236 108 A 148 148 0 0 1 340 152 L 273 218 A 54 54 0 0 0 236 202 Z" fill="#FFFFFF" opacity="0.12" />
    <path d="M 236 404 A 148 148 0 0 1 132 360 L 199 294 A 54 54 0 0 0 236 310 Z" fill="#FFFFFF" opacity="0.12" />

    <!-- Center Crimson Record Label -->
    <circle cx="236" cy="256" r="54" fill="url(#tt-label)" stroke="#FFE082" stroke-width="2" />
    <circle cx="236" cy="256" r="14" fill="#0C0A09" stroke="#FFE082" stroke-width="2" />

    <!-- Tonearm & Stylus Needle -->
    <g transform="translate(372, 136)" filter="url(#tt-elem-shadow)">
      <!-- Base Pivot -->
      <circle cx="0" cy="0" r="28" fill="#1A1614" stroke="#D4AF37" stroke-width="2.5" />
      <circle cx="0" cy="0" r="14" fill="#D4AF37" />

      <!-- Curved Tonearm Rod -->
      <path d="M 0 0 L -60 120 L -116 190" fill="none" stroke="url(#tt-arm)" stroke-width="8" stroke-linecap="round" />

      <!-- Cartridge Head & Needle -->
      <rect x="-132" y="184" width="22" height="36" rx="6" transform="rotate(30 -121 202)" fill="#1A1614" stroke="#D4AF37" stroke-width="2" />
    </g>
  </g>

  <!-- Outer Squircle Rim Highlight -->
  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="3" />
</svg>
