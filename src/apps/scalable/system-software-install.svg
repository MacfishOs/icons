<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="sw-base-shadow" x="-15%" y="-10%" width="130%" height="135%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#00241E" flood-opacity="0.28" />
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#00241E" flood-opacity="0.14" />
    </filter>
    <filter id="sw-elem-shadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#001F18" flood-opacity="0.35" />
    </filter>

    <linearGradient id="sw-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2A0" />
      <stop offset="50%" stop-color="#00A87A" />
      <stop offset="100%" stop-color="#007052" />
    </linearGradient>

    <linearGradient id="sw-box-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#C2EFE3" />
    </linearGradient>

    <linearGradient id="sw-box-front" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8FAF5" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#A7E5D5" stop-opacity="0.85" />
    </linearGradient>

    <linearGradient id="sw-arrow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#007A5A" />
      <stop offset="50%" stop-color="#00C792" />
      <stop offset="100%" stop-color="#38EFBE" />
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="url(#sw-bg)" filter="url(#sw-base-shadow)" />

  <g transform="translate(256, 256) scale(0.85) translate(-256, -256)" filter="url(#sw-elem-shadow)">
    <!-- 3D Software Package Isometric Flaps -->
    <!-- Top-Left Flap -->
    <polygon points="140,210 256,160 216,110 110,164" fill="url(#sw-box-top)" opacity="0.9" stroke="#FFFFFF" stroke-width="1.5" />
    <!-- Top-Right Flap -->
    <polygon points="372,210 256,160 296,110 402,164" fill="url(#sw-box-top)" opacity="0.8" stroke="#FFFFFF" stroke-width="1.5" />

    <!-- Isometric Package Body Cube -->
    <polygon points="140,210 256,260 256,396 140,336" fill="#005740" opacity="0.6" />
    <polygon points="372,210 256,260 256,396 372,336" fill="#003D2D" opacity="0.7" />
    <polygon points="256,160 372,210 256,260 140,210" fill="url(#sw-box-front)" stroke="#FFFFFF" stroke-width="2" />

    <!-- Dynamic Download / Install Arrow Rising Out -->
    <g transform="translate(256, 224) scale(0.9) translate(-256, -256)">
      <path d="M 256 120 L 320 196 H 280 V 300 H 232 V 196 H 192 Z" fill="#FFFFFF" stroke="#00A87A" stroke-width="4" filter="url(#sw-elem-shadow)" />
      <circle cx="256" cy="96" r="10" fill="#FFFFFF" />
    </g>
  </g>

  <!-- Outer Squircle Rim Highlight -->
  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="3" />
</svg>
