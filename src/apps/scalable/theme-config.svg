<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="tc-base-shadow" x="-15%" y="-10%" width="130%" height="135%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#001433" flood-opacity="0.28" />
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#001433" flood-opacity="0.14" />
    </filter>
    <filter id="tc-elem-shadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000C1F" flood-opacity="0.35" />
    </filter>

    <linearGradient id="tc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E88E5" />
      <stop offset="50%" stop-color="#1565C0" />
      <stop offset="100%" stop-color="#0A387E" />
    </linearGradient>

    <linearGradient id="tc-wheel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5252" />
      <stop offset="33%" stop-color="#FFD600" />
      <stop offset="66%" stop-color="#00E676" />
      <stop offset="100%" stop-color="#00B0FF" />
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="url(#tc-bg)" filter="url(#tc-base-shadow)" />

  <g transform="translate(256, 256) scale(0.8) translate(-256, -256)" filter="url(#tc-elem-shadow)">
    <!-- Palette Color Swatch Ring -->
    <circle cx="256" cy="256" r="140" fill="none" stroke="url(#tc-wheel)" stroke-width="36" />
    <circle cx="256" cy="256" r="140" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="2" />

    <!-- 3D Artist Paintbrush -->
    <g transform="translate(256, 256) rotate(45) translate(-256, -256)">
      <rect x="246" y="120" width="20" height="180" rx="10" fill="#FFFFFF" stroke="#ADC8F0" stroke-width="2" />
      <polygon points="246,300 256,340 266,300" fill="#FFD600" />
      <rect x="246" y="270" width="20" height="12" fill="#FF5252" />
    </g>
  </g>

  <!-- Outer Squircle Rim Highlight -->
  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="3" />
</svg>
