<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="vc-base-shadow" x="-15%" y="-10%" width="130%" height="135%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#00184A" flood-opacity="0.30" />
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#00184A" flood-opacity="0.14" />
    </filter>
    <filter id="vc-elem-shadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000D2B" flood-opacity="0.35" />
    </filter>

    <linearGradient id="vc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E88E5" />
      <stop offset="50%" stop-color="#0D47A1" />
      <stop offset="100%" stop-color="#051B44" />
    </linearGradient>

    <linearGradient id="vc-speaker" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#D0E2FF" />
    </linearGradient>

    <linearGradient id="vc-wave" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4" />
      <stop offset="100%" stop-color="#40C4FF" />
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="url(#vc-bg)" filter="url(#vc-base-shadow)" />

  <g transform="translate(256, 256) scale(0.74) translate(-256, -256)" filter="url(#vc-elem-shadow)">
    <!-- Speaker Body Cone -->
    <path d="M 124 204 H 176 L 246 142 C 254 134, 268 140, 268 152 V 360 C 268 372, 254 378, 246 370 L 176 308 H 124 C 114 308, 106 300, 106 290 V 222 C 106 212, 114 204, 124 204 Z"
          fill="url(#vc-speaker)" stroke="#FFFFFF" stroke-width="3" />

    <!-- 3 Sinuous Sound Waves Waves -->
    <!-- Small Wave -->
    <path d="M 306 216 A 64 64 0 0 1 306 296" fill="none" stroke="url(#vc-wave)" stroke-width="16" stroke-linecap="round" />
    <!-- Medium Wave -->
    <path d="M 346 182 A 114 114 0 0 1 346 330" fill="none" stroke="url(#vc-wave)" stroke-width="16" stroke-linecap="round" />
    <!-- Large Wave -->
    <path d="M 386 148 A 164 164 0 0 1 386 364" fill="none" stroke="url(#vc-wave)" stroke-width="16" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- Outer Squircle Rim Highlight -->
  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="3" />
</svg>
