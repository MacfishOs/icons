<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="cm-base-shadow" x="-15%" y="-10%" width="130%" height="135%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#051224" flood-opacity="0.22" />
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#051224" flood-opacity="0.10" />
    </filter>
    <filter id="cm-elem-shadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#0A1830" flood-opacity="0.24" />
    </filter>

    <linearGradient id="cm-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F2F6FC" />
      <stop offset="100%" stop-color="#DFE7F5" />
    </linearGradient>

    <linearGradient id="cm-border" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#ADC8F0" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="cm-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D6D" /><stop offset="100%" stop-color="#D6002A" />
    </linearGradient>
    <linearGradient id="cm-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38B6FF" /><stop offset="100%" stop-color="#0052CC" />
    </linearGradient>
    <linearGradient id="cm-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2EE68A" /><stop offset="100%" stop-color="#00A855" />
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="url(#cm-bg)" stroke="url(#cm-border)" stroke-width="3" filter="url(#cm-base-shadow)" />

  <g transform="translate(256, 256) scale(0.88) translate(-256, -256)" filter="url(#cm-elem-shadow)">
    <!-- CMake 3-Faceted Prism Triangles -->
    <!-- Facet 1: Red Triangle (Top) -->
    <polygon points="256,88 126,380 256,290" fill="url(#cm-red)" stroke="#FFFFFF" stroke-width="2.5" />

    <!-- Facet 2: Blue Triangle (Bottom-Right) -->
    <polygon points="256,290 386,380 126,380" fill="url(#cm-blue)" stroke="#FFFFFF" stroke-width="2.5" />

    <!-- Facet 3: Green Triangle (Right) -->
    <polygon points="256,88 386,380 256,290" fill="url(#cm-green)" stroke="#FFFFFF" stroke-width="2.5" />

    <!-- Center Specular Star Reflection -->
    <circle cx="256" cy="290" r="10" fill="#FFFFFF" />
  </g>
</svg>
