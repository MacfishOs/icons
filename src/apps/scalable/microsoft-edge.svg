<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="ed-base-shadow" x="-15%" y="-10%" width="130%" height="135%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#041228" flood-opacity="0.22" />
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#041228" flood-opacity="0.10" />
    </filter>
    <filter id="ed-elem-shadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#021C38" flood-opacity="0.28" />
    </filter>

    <linearGradient id="ed-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F0F6FF" />
      <stop offset="100%" stop-color="#D6E6FA" />
    </linearGradient>

    <linearGradient id="ed-border" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#ADC8F0" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="ed-wave-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C9FF" />
      <stop offset="50%" stop-color="#0072FF" />
      <stop offset="100%" stop-color="#003399" />
    </linearGradient>

    <linearGradient id="ed-wave-bottom" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#11998E" />
      <stop offset="50%" stop-color="#38EF7D" />
      <stop offset="100%" stop-color="#00F5D4" />
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="url(#ed-bg)" stroke="url(#ed-border)" stroke-width="3" filter="url(#ed-base-shadow)" />

  <g transform="translate(256, 256) scale(0.78) translate(-256, -256)" filter="url(#ed-elem-shadow)">
    <!-- Edge Swirling Wave Ribbon Outer Crest -->
    <path d="M 256 104 C 342 104, 400 174, 388 256 C 378 328, 312 396, 224 404 C 144 412, 108 348, 120 274 C 132 208, 186 196, 220 236 C 246 266, 288 266, 296 232 C 304 198, 274 168, 224 168 C 174 168, 134 208, 134 208 C 134 208, 160 104, 256 104 Z"
          fill="url(#ed-wave-top)" />

    <!-- Bottom Swirling Crest Wrapping Forward -->
    <path d="M 120 274 C 132 358, 204 408, 284 394 C 356 382, 396 312, 388 256 C 368 286, 324 308, 274 300 C 220 292, 172 238, 120 274 Z"
          fill="url(#ed-wave-bottom)" opacity="0.9" />

    <!-- Specular Highlight Crest -->
    <ellipse cx="280" cy="148" rx="54" ry="22" transform="rotate(-20 280 148)" fill="#FFFFFF" opacity="0.35" />
  </g>
</svg>
