<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="vp-base-shadow" x="-15%" y="-10%" width="130%" height="135%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0E0521" flood-opacity="0.30" />
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0E0521" flood-opacity="0.15" />
    </filter>
    <filter id="vp-card-shadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#090214" flood-opacity="0.38" />
    </filter>

    <linearGradient id="vp-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#281B47" />
      <stop offset="55%" stop-color="#170F2E" />
      <stop offset="100%" stop-color="#0D081C" />
    </linearGradient>

    <linearGradient id="vp-border" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9B6BFF" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#140C26" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="vp-card-back" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF477E" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#FF8533" stop-opacity="0.82" />
    </linearGradient>

    <linearGradient id="vp-card-front" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4CC9F0" stop-opacity="0.88" />
      <stop offset="50%" stop-color="#4361EE" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#7209B7" stop-opacity="0.92" />
    </linearGradient>

    <linearGradient id="vp-play" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0EAFF" />
    </linearGradient>
  </defs>

  <!-- macOS Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="url(#vp-bg)" stroke="url(#vp-border)" stroke-width="3" filter="url(#vp-base-shadow)" />

  <!-- Inner Artwork Scaled & Centered to Fill Dock Slot -->
  <g transform="translate(256, 256) scale(1.132075) translate(-256, -256)">
    <g filter="url(#vp-card-shadow)">
      <rect x="116" y="136" width="280" height="220" rx="52" transform="rotate(-10 256 246)" fill="url(#vp-card-back)" stroke="#FFD1E0" stroke-opacity="0.55" stroke-width="2" />
      <rect x="116" y="152" width="280" height="220" rx="52" fill="url(#vp-card-front)" stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="2.5" />
      <path d="M 230 220
               C 230 210, 241 204, 250 210
               L 306 246
               C 314 251, 314 263, 306 268
               L 250 304
               C 241 310, 230 304, 230 294
               Z" fill="url(#vp-play)" filter="url(#vp-card-shadow)" />
      <rect x="176" y="336" width="160" height="8" rx="4" fill="#FFFFFF" opacity="0.4" />
      <rect x="176" y="336" width="92" height="8" rx="4" fill="#FFFFFF" opacity="0.9" />
    </g>
  </g>
</svg>