<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="qb-base-shadow" x="-15%" y="-10%" width="130%" height="135%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#021C08" flood-opacity="0.28" />
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#021C08" flood-opacity="0.14" />
    </filter>
    <filter id="qb-elem-shadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#010E04" flood-opacity="0.35" />
    </filter>

    <linearGradient id="qb-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#41CD52" />
      <stop offset="50%" stop-color="#21A034" />
      <stop offset="100%" stop-color="#0E6B20" />
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="url(#qb-bg)" filter="url(#qb-base-shadow)" />

  <g transform="translate(256, 256) scale(0.85) translate(-256, -256)" filter="url(#qb-elem-shadow)">
    <!-- D-Bus Network Tree Architecture Nodes -->
    <!-- Central Hub -->
    <circle cx="176" cy="256" r="32" fill="#FFFFFF" stroke="#0E6B20" stroke-width="4" />

    <!-- Connecting Bus Cables -->
    <path d="M 176 256 C 256 256, 256 160, 336 160" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" />
    <path d="M 176 256 H 336" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" />
    <path d="M 176 256 C 256 256, 256 352, 336 352" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" />

    <!-- Branch Nodes -->
    <circle cx="336" cy="160" r="26" fill="#00E5FF" stroke="#FFFFFF" stroke-width="4" />
    <circle cx="336" cy="256" r="26" fill="#FFD600" stroke="#FFFFFF" stroke-width="4" />
    <circle cx="336" cy="352" r="26" fill="#FF5252" stroke="#FFFFFF" stroke-width="4" />
  </g>

  <!-- Outer Squircle Rim Highlight -->
  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="3" />
</svg>
