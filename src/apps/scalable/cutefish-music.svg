<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="mu-base-shadow" x="-15%" y="-10%" width="130%" height="135%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#700010" flood-opacity="0.32" />
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#700010" flood-opacity="0.16" />
    </filter>
    <filter id="mu-note-shadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#50000C" flood-opacity="0.35" />
    </filter>

    <linearGradient id="mu-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF3B5C" />
      <stop offset="50%" stop-color="#FA233B" />
      <stop offset="100%" stop-color="#D70015" />
    </linearGradient>

    <linearGradient id="mu-rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#FFA8B6" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="mu-disc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#FFF0F2" stop-opacity="0.85" />
    </linearGradient>
  </defs>

  <!-- Full-Canvas HarmonyOS Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="url(#mu-bg)" filter="url(#mu-base-shadow)" />

  <!-- Calibrated Glyph Group (Scale 0.85) -->
  <g transform="translate(256, 256) scale(0.85) translate(-256, -256)" filter="url(#mu-note-shadow)">
    <!-- Top Acrylic Sheen -->
    <ellipse cx="256" cy="168" rx="150" ry="60" fill="#FFFFFF" opacity="0.15" />

    <!-- Stylized Double Musical Notes -->
    <path fill="url(#mu-disc)" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="2" d="
      M 346,122
      L 220,152
      L 220,326
      C 204,314 182,306 158,306
      C 112,306 74,330 74,364
      C 74,398 112,422 158,422
      C 204,422 242,398 242,364
      L 242,206
      L 346,180
      L 346,298
      C 330,286 308,278 284,278
      C 238,278 200,302 200,336
      C 200,370 238,394 284,394
      C 330,394 368,370 368,336
      L 368,142
      C 368,128 358,119 346,122 Z
    " />
  </g>

  <!-- Squircle Rim Highlight -->
  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="none" stroke="url(#mu-rim)" stroke-width="3" />
</svg>
