<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="nv-base-shadow" x="-15%" y="-10%" width="130%" height="135%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#02141C" flood-opacity="0.30" />
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#02141C" flood-opacity="0.15" />
    </filter>
    <filter id="nv-elem-shadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#010A0E" flood-opacity="0.38" />
    </filter>

    <linearGradient id="nv-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#143444" />
      <stop offset="50%" stop-color="#0C1F29" />
      <stop offset="100%" stop-color="#050E14" />
    </linearGradient>

    <!-- Left Leg (Green) -->
    <linearGradient id="nv-left" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#84F263" />
      <stop offset="100%" stop-color="#2DA44E" />
    </linearGradient>

    <!-- Diagonal Bridge (Emerald to Cyan) -->
    <linearGradient id="nv-diag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DA44E" />
      <stop offset="50%" stop-color="#00D2D3" />
      <stop offset="100%" stop-color="#0080FF" />
    </linearGradient>

    <!-- Right Leg (Cyan-Blue) -->
    <linearGradient id="nv-right" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#48DBFB" />
      <stop offset="100%" stop-color="#0984E3" />
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="url(#nv-bg)" filter="url(#nv-base-shadow)" />

  <g transform="translate(256, 256) scale(0.88) translate(-256, -256)" filter="url(#nv-elem-shadow)">
    <!-- Ambient Target Ring -->
    <circle cx="256" cy="256" r="160" fill="none" stroke="#2DA44E" stroke-opacity="0.16" stroke-width="2" />

    <!-- Neovim 3D Folded Ribbon "N" -->
    <!-- Left Column Leg -->
    <path d="M 136 122 L 204 158 V 390 L 136 354 Z" fill="url(#nv-left)" stroke="#A6FFAE" stroke-opacity="0.75" stroke-width="2" />

    <!-- Right Column Leg -->
    <path d="M 376 122 L 308 158 V 390 L 376 354 Z" fill="url(#nv-right)" stroke="#AEE2FF" stroke-opacity="0.75" stroke-width="2" />

    <!-- Sweeping Diagonal Ribbon -->
    <path d="M 204 158 L 376 354 L 308 390 L 136 194 Z" fill="url(#nv-diag)" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="2" />

    <!-- Corner Sheen Highlight Points -->
    <circle cx="204" cy="158" r="6" fill="#FFFFFF" />
    <circle cx="308" cy="390" r="6" fill="#FFFFFF" />
  </g>

  <!-- Outer Squircle Rim Highlight -->
  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="3" />
</svg>
