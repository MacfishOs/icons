<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="gp-base-shadow" x="-15%" y="-10%" width="130%" height="135%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#040810" flood-opacity="0.28" />
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#040810" flood-opacity="0.14" />
    </filter>
    <filter id="gp-elem-shadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#020408" flood-opacity="0.35" />
    </filter>

    <linearGradient id="gp-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#283242" />
      <stop offset="50%" stop-color="#1A212E" />
      <stop offset="100%" stop-color="#0E121A" />
    </linearGradient>

    <linearGradient id="gp-platter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#D4DEED" />
      <stop offset="100%" stop-color="#8EA2BC" />
    </linearGradient>

    <linearGradient id="gp-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4" /><stop offset="100%" stop-color="#00A8FF" />
    </linearGradient>
    <linearGradient id="gp-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD600" /><stop offset="100%" stop-color="#FF6D00" />
    </linearGradient>
    <linearGradient id="gp-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E040FB" /><stop offset="100%" stop-color="#7C4DFF" />
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="url(#gp-bg)" filter="url(#gp-base-shadow)" />

  <g transform="translate(256, 256) scale(0.8) translate(-256, -256)" filter="url(#gp-elem-shadow)">
    <!-- Base HDD Metal Platter -->
    <circle cx="256" cy="256" r="144" fill="url(#gp-platter)" stroke="#FFFFFF" stroke-width="2.5" />
    <circle cx="256" cy="256" r="144" fill="none" stroke="#607696" stroke-opacity="0.3" stroke-width="1.5" />
    <circle cx="256" cy="256" r="124" fill="none" stroke="#607696" stroke-opacity="0.25" stroke-width="1.5" />

    <!-- Partition Segments Ring -->
    <!-- Segment 1: Cyan (120 deg) -->
    <circle cx="256" cy="256" r="92" fill="none" stroke="url(#gp-cyan)" stroke-width="36" stroke-dasharray="192 386" stroke-dashoffset="0" />
    <!-- Segment 2: Amber (90 deg) -->
    <circle cx="256" cy="256" r="92" fill="none" stroke="url(#gp-amber)" stroke-width="36" stroke-dasharray="144 434" stroke-dashoffset="-200" />
    <!-- Segment 3: Purple (110 deg) -->
    <circle cx="256" cy="256" r="92" fill="none" stroke="url(#gp-purple)" stroke-width="36" stroke-dasharray="176 402" stroke-dashoffset="-352" />

    <!-- Center Spindle -->
    <circle cx="256" cy="256" r="44" fill="#1C2331" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="2" />
    <circle cx="256" cy="256" r="22" fill="#D4DEED" />
    <circle cx="256" cy="256" r="10" fill="#1C2331" />

    <!-- Read/Write Head Arm -->
    <g transform="translate(256, 256) rotate(-35) translate(-256, -256)">
      <polygon points="256,256 384,336 376,348 248,266" fill="#FFFFFF" opacity="0.9" filter="url(#gp-elem-shadow)" />
      <circle cx="380" cy="342" r="14" fill="#00E5FF" stroke="#FFFFFF" stroke-width="2" />
      <circle cx="252" cy="260" r="4" fill="#00E5FF" />
    </g>
  </g>

  <!-- Outer Squircle Rim Highlight -->
  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="3" />
</svg>
