<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="te-base-shadow" x="-15%" y="-10%" width="130%" height="135%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#2E1200" flood-opacity="0.28" />
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#2E1200" flood-opacity="0.14" />
    </filter>
    <filter id="te-elem-shadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1A0A00" flood-opacity="0.25" />
    </filter>

    <linearGradient id="te-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA826" />
      <stop offset="50%" stop-color="#FF7315" />
      <stop offset="100%" stop-color="#E04400" />
    </linearGradient>

    <linearGradient id="te-paper" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F2F5FA" />
    </linearGradient>

    <linearGradient id="te-pen-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#D0D8E8" />
      <stop offset="100%" stop-color="#9EABC2" />
    </linearGradient>

    <linearGradient id="te-pen-nib" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#FF9900" />
    </linearGradient>
  </defs>

  <!-- Full-Canvas Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="url(#te-bg)" filter="url(#te-base-shadow)" />

  <g transform="translate(256, 256) scale(0.78) translate(-256, -256)">
    <!-- Notepad Document Card with Folded Corner -->
    <g filter="url(#te-elem-shadow)">
      <path d="M 124 104 C 124 88, 136 76, 152 76 H 312 L 388 152 V 408 C 388 424, 376 436, 360 436 H 152 C 136 436, 124 424, 124 408 Z"
            fill="url(#te-paper)" stroke="#FFFFFF" stroke-width="2" />
      <!-- Folded Flap -->
      <path d="M 312 76 V 136 C 312 148, 320 152, 332 152 H 388 Z" fill="#DDE4F0" />
    </g>

    <!-- Syntax Code / Text Lines -->
    <g transform="translate(164, 168)">
      <!-- Line 1: Header (Cyan + Violet) -->
      <rect x="0" y="0" width="64" height="18" rx="9" fill="#0091FF" />
      <rect x="74" y="0" width="112" height="18" rx="9" fill="#9C27B0" opacity="0.85" />

      <!-- Line 2: Indented (Orange) -->
      <rect x="36" y="38" width="132" height="18" rx="9" fill="#FF6D00" opacity="0.85" />

      <!-- Line 3: Indented (Emerald) -->
      <rect x="36" y="76" width="84" height="18" rx="9" fill="#00C853" opacity="0.85" />
      <rect x="130" y="76" width="56" height="18" rx="9" fill="#607D8B" opacity="0.6" />

      <!-- Line 4: Body (Blue + Slate) -->
      <rect x="0" y="114" width="94" height="18" rx="9" fill="#00B0FF" opacity="0.85" />
      <rect x="104" y="114" width="76" height="18" rx="9" fill="#90A4AE" opacity="0.6" />

      <!-- Line 5: Closing tag -->
      <rect x="0" y="152" width="48" height="18" rx="9" fill="#9C27B0" opacity="0.85" />
    </g>

    <!-- Floating 3D Stylus Pen -->
    <g transform="translate(340, 340) rotate(-45) translate(-30, -100)" filter="url(#te-elem-shadow)">
      <rect x="18" y="0" width="24" height="120" rx="12" fill="url(#te-pen-body)" stroke="#FFFFFF" stroke-width="1.5" />
      <!-- Golden Nib -->
      <polygon points="18,120 30,154 42,120" fill="url(#te-pen-nib)" />
      <!-- Accent Ring -->
      <rect x="18" y="80" width="24" height="8" fill="#FF5722" />
    </g>
  </g>

  <!-- Outer Squircle Rim Highlight -->
  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="3" />
</svg>
