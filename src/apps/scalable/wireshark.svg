<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Base Squircle Shadow -->
    <filter id="ws-base-shadow" x="-15%" y="-10%" width="130%" height="135%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#021024" flood-opacity="0.28" />
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#021024" flood-opacity="0.14" />
    </filter>

    <!-- 3D Shark Fin Shadow -->
    <filter id="ws-elem-shadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#001530" flood-opacity="0.42" />
    </filter>

    <!-- Exact 480x480 Squircle Clip Path (Isolated from scaling) -->
    <clipPath id="ws-squircle-clip">
      <rect x="16" y="16" width="480" height="480" rx="110" ry="110" />
    </clipPath>

    <!-- Deep Ocean Squircle Base -->
    <linearGradient id="ws-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A58CA" />
      <stop offset="50%" stop-color="#05327A" />
      <stop offset="100%" stop-color="#021842" />
    </linearGradient>

    <!-- Outer Rim Border Gradient -->
    <linearGradient id="ws-border" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#80C4FF" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#031D4D" stop-opacity="0.9" />
    </linearGradient>

    <!-- 3D Sculpted Shark Fin -->
    <linearGradient id="ws-fin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="55%" stop-color="#8CE9FF" />
      <stop offset="100%" stop-color="#0099FF" />
    </linearGradient>

    <!-- Back Translucent Wave -->
    <linearGradient id="ws-wave-back" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00C8FF" stop-opacity="0.42" />
      <stop offset="100%" stop-color="#0077FF" stop-opacity="0.28" />
    </linearGradient>

    <!-- Front HarmonyOS Frosted Acrylic Wave -->
    <linearGradient id="ws-wave-glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#47E0FF" stop-opacity="0.82" />
      <stop offset="100%" stop-color="#0052CC" stop-opacity="0.95" />
    </linearGradient>
  </defs>

  <!-- 1. Full Edge-to-Edge Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="url(#ws-bg)" filter="url(#ws-base-shadow)" />

  <!-- 2. Strictly Clipped Interior (Unscaled Clip Group so corners never bleed) -->
  <g clip-path="url(#ws-squircle-clip)">
    <!-- Scaled Center Elements (Radar & Shark Fin) -->
    <g transform="translate(256, 252) scale(1.14) translate(-256, -252)">
      <!-- Packet Capture Sonar Rings -->
      <circle cx="256" cy="236" r="168" fill="none" stroke="#4DD2FF" stroke-opacity="0.16" stroke-width="2" stroke-dasharray="12 8" />
      <circle cx="256" cy="236" r="122" fill="none" stroke="#4DD2FF" stroke-opacity="0.24" stroke-width="2" />

      <!-- Sculpted 3D Dorsal Shark Fin -->
      <path d="M 132 346
               C 160 244, 224 138, 332 108
               C 296 174, 288 246, 318 346
               Z" fill="url(#ws-fin)" stroke="#FFFFFF" stroke-width="2.5" filter="url(#ws-elem-shadow)" />
    </g>

    <!-- Full-Width Ocean Waves (Spans 0 to 512, cleanly trimmed by ws-squircle-clip) -->
    <path d="M 0 326 C 140 284, 260 368, 512 308 L 512 512 L 0 512 Z" fill="url(#ws-wave-back)" />

    <path d="M 0 356 C 168 386, 312 294, 512 344 L 512 512 L 0 512 Z" fill="url(#ws-wave-glass)" />

    <!-- Top Specular Crest on Front Wave -->
    <path d="M 0 356 C 168 386, 312 294, 512 344" fill="none" stroke="#B3F5FF" stroke-opacity="0.75" stroke-width="3" />
  </g>

  <!-- 3. Clean Outer Squircle Rim Highlight (Drawn on top to seal the edges) -->
  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="none" stroke="url(#ws-border)" stroke-width="3" />
</svg>