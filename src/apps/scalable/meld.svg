<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="ml-base-shadow" x="-15%" y="-10%" width="130%" height="135%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#08182E" flood-opacity="0.22" />
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#08182E" flood-opacity="0.10" />
    </filter>
    <filter id="ml-elem-shadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#001838" flood-opacity="0.20" />
    </filter>

    <linearGradient id="ml-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F2F6FC" />
      <stop offset="100%" stop-color="#DCE6F5" />
    </linearGradient>

    <linearGradient id="ml-border" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#ADC8F0" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="ml-blue-file" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38B6FF" /><stop offset="100%" stop-color="#0066FF" />
    </linearGradient>
    <linearGradient id="ml-green-file" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2AF584" /><stop offset="100%" stop-color="#00B855" />
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="url(#ml-bg)" stroke="url(#ml-border)" stroke-width="3" filter="url(#ml-base-shadow)" />

  <g transform="translate(256, 256) scale(0.76) translate(-256, -256)" filter="url(#ml-elem-shadow)">
    <!-- Left Document Sheet -->
    <rect x="108" y="104" width="128" height="304" rx="24" fill="#FFFFFF" stroke="#B8CCE8" stroke-width="2" />
    <!-- Blue Diff Chunks on Left -->
    <rect x="124" y="148" width="96" height="24" rx="8" fill="url(#ml-blue-file)" />
    <rect x="124" y="220" width="96" height="48" rx="8" fill="url(#ml-blue-file)" />
    <rect x="124" y="316" width="72" height="20" rx="8" fill="#B0C8E8" />

    <!-- Right Document Sheet -->
    <rect x="276" y="104" width="128" height="304" rx="24" fill="#FFFFFF" stroke="#B8CCE8" stroke-width="2" />
    <!-- Green Diff Chunks on Right -->
    <rect x="292" y="148" width="96" height="24" rx="8" fill="url(#ml-green-file)" />
    <rect x="292" y="244" width="96" height="48" rx="8" fill="url(#ml-green-file)" />
    <rect x="292" y="316" width="72" height="20" rx="8" fill="#B0C8E8" />

    <!-- Connecting Flow Ribbon Bridge -->
    <path d="M 220 220 C 256 220, 256 244, 292 244 V 292 C 256 292, 256 268, 220 268 Z" fill="#40C4FF" opacity="0.45" />

    <!-- Diff Merge Arrows -->
    <circle cx="256" cy="160" r="14" fill="#0066FF" />
    <path d="M 252 152 L 260 160 L 252 168" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
