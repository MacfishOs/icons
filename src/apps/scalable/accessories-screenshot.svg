<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="sc-base-shadow" x="-15%" y="-10%" width="130%" height="135%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#050810" flood-opacity="0.28" />
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#050810" flood-opacity="0.14" />
    </filter>
    <filter id="sc-elem-shadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#020408" flood-opacity="0.4" />
    </filter>

    <linearGradient id="sc-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#252D3D" />
      <stop offset="50%" stop-color="#181D28" />
      <stop offset="100%" stop-color="#0E121A" />
    </linearGradient>

    <linearGradient id="sc-lens-bezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#73849E" />
      <stop offset="50%" stop-color="#3A4354" />
      <stop offset="100%" stop-color="#1F2530" />
    </linearGradient>

    <linearGradient id="sc-lens-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#4FACFE" />
      <stop offset="100%" stop-color="#0044B5" />
    </linearGradient>

    <linearGradient id="sc-iris" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C2331" />
      <stop offset="100%" stop-color="#090C12" />
    </linearGradient>
  </defs>

  <!-- Full-Canvas Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="url(#sc-bg)" filter="url(#sc-base-shadow)" />

  <!-- Centered Screenshot Camera & Frame -->
  <g transform="translate(256, 256) scale(0.86) translate(-256, -256)">
    <!-- 4 Screen Clipping Reticle Corner Brackets -->
    <path d="M 120 160 V 120 H 160" stroke="#00E5FF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />
    <path d="M 392 160 V 120 H 352" stroke="#00E5FF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />
    <path d="M 120 352 V 392 H 160" stroke="#00E5FF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />
    <path d="M 392 352 V 392 H 352" stroke="#00E5FF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />

    <!-- Outer Precision Lens Bezel Ring -->
    <circle cx="256" cy="256" r="132" fill="url(#sc-lens-bezel)" filter="url(#sc-elem-shadow)" stroke="#8FA4C4" stroke-width="3" />
    <circle cx="256" cy="256" r="114" fill="url(#sc-iris)" stroke="#0E121A" stroke-width="3" />

    <!-- Coated Optics Glass Element -->
    <circle cx="256" cy="256" r="86" fill="url(#sc-lens-glass)" stroke="#80D8FF" stroke-width="2.5" />
    <circle cx="256" cy="256" r="48" fill="#08101E" opacity="0.9" />

    <!-- Top Specular Glare Reflection on Lens -->
    <ellipse cx="236" cy="226" rx="42" ry="24" transform="rotate(-30 236 226)" fill="#FFFFFF" opacity="0.32" />
    <circle cx="282" cy="286" r="8" fill="#FFFFFF" opacity="0.4" />

    <!-- Aperture Sensor LED indicator -->
    <circle cx="360" cy="152" r="8" fill="#FF5252" />
    <circle cx="360" cy="152" r="4" fill="#FFFFFF" opacity="0.8" />
  </g>

  <!-- Outer Squircle Rim Highlight -->
  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="3" />
</svg>
