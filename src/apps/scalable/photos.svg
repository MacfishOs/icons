<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Multi-stage ambient + key light drop shadows -->
    <filter id="ph-shadow-base" x="-20%" y="-15%" width="140%" height="145%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#080E1E" flood-opacity="0.26" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#080E1E" flood-opacity="0.12" />
    </filter>

    <filter id="ph-shadow-petal" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#050814" flood-opacity="0.18" />
    </filter>

    <filter id="ph-shadow-center" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.22" />
    </filter>

    <!-- Pristine Glass Base Tile Gradients -->
    <linearGradient id="ph-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="65%" stop-color="#F4F7FC" />
      <stop offset="100%" stop-color="#E2E8F4" />
    </linearGradient>

    <linearGradient id="ph-border" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#BAC5D6" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="ph-highlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- 8 Petal Vibrant Apple Gradients -->
    <!-- 1. Top (Magenta/Red) -->
    <linearGradient id="petal-1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF2D55" />
      <stop offset="100%" stop-color="#FF5E3A" />
    </linearGradient>

    <!-- 2. Top-Right (Orange) -->
    <linearGradient id="petal-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9500" />
      <stop offset="100%" stop-color="#FFCC00" />
    </linearGradient>

    <!-- 3. Right (Yellow) -->
    <linearGradient id="petal-3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFCC00" />
      <stop offset="100%" stop-color="#D4E157" />
    </linearGradient>

    <!-- 4. Bottom-Right (Lime) -->
    <linearGradient id="petal-4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A4C639" />
      <stop offset="100%" stop-color="#30D158" />
    </linearGradient>

    <!-- 5. Bottom (Green) -->
    <linearGradient id="petal-5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34C759" />
      <stop offset="100%" stop-color="#00E676" />
    </linearGradient>

    <!-- 6. Bottom-Left (Cyan) -->
    <linearGradient id="petal-6" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00C7BE" />
      <stop offset="100%" stop-color="#64D2FF" />
    </linearGradient>

    <!-- 7. Left (Blue) -->
    <linearGradient id="petal-7" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#007AFF" />
      <stop offset="100%" stop-color="#0A84FF" />
    </linearGradient>

    <!-- 8. Top-Left (Purple) -->
    <linearGradient id="petal-8" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#5856D6" />
      <stop offset="100%" stop-color="#AF52DE" />
    </linearGradient>

    <!-- Center Ring Glass & Specular Glow -->
    <linearGradient id="ph-center-ring" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#EFF3FA" stop-opacity="0.88" />
    </linearGradient>

    <linearGradient id="ph-lens-glare" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.90" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.10" />
    </linearGradient>
  </defs>

  <!-- Solid Smooth Squircle Base with Soft Drop Shadow -->
  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="url(#ph-bg)" stroke="url(#ph-border)" stroke-width="3" filter="url(#ph-shadow-base)" />

  <!-- Subtle Top Reflection Overlay -->
  <rect x="18" y="18" width="476" height="230" rx="108" ry="108" fill="url(#ph-highlight)" opacity="0.6" />

  <!-- Central Flower Aperture (8 Translucent Overlapping Petals) -->
  <g transform="translate(256, 256)" filter="url(#ph-shadow-petal)">
    <!-- Petal 1 (0° Top) -->
    <rect x="-30" y="-140" width="60" height="110" rx="30" fill="url(#petal-1)" opacity="0.92" />

    <!-- Petal 2 (45° Top-Right) -->
    <rect x="-30" y="-140" width="60" height="110" rx="30" transform="rotate(45)" fill="url(#petal-2)" opacity="0.92" />

    <!-- Petal 3 (90° Right) -->
    <rect x="-30" y="-140" width="60" height="110" rx="30" transform="rotate(90)" fill="url(#petal-3)" opacity="0.92" />

    <!-- Petal 4 (135° Bottom-Right) -->
    <rect x="-30" y="-140" width="60" height="110" rx="30" transform="rotate(135)" fill="url(#petal-4)" opacity="0.92" />

    <!-- Petal 5 (180° Bottom) -->
    <rect x="-30" y="-140" width="60" height="110" rx="30" transform="rotate(180)" fill="url(#petal-5)" opacity="0.92" />

    <!-- Petal 6 (225° Bottom-Left) -->
    <rect x="-30" y="-140" width="60" height="110" rx="30" transform="rotate(225)" fill="url(#petal-6)" opacity="0.92" />

    <!-- Petal 7 (270° Left) -->
    <rect x="-30" y="-140" width="60" height="110" rx="30" transform="rotate(270)" fill="url(#petal-7)" opacity="0.92" />

    <!-- Petal 8 (315° Top-Left) -->
    <rect x="-30" y="-140" width="60" height="110" rx="30" transform="rotate(315)" fill="url(#petal-8)" opacity="0.92" />

    <!-- Frosted Glass Core Disk -->
    <circle cx="0" cy="0" r="48" fill="url(#ph-center-ring)" stroke="url(#ph-lens-glare)" stroke-width="3" filter="url(#ph-shadow-center)" />
    <circle cx="0" cy="0" r="26" fill="#007AFF" opacity="0.10" />

    <!-- Specular Highlight Spot -->
    <circle cx="-12" cy="-12" r="8" fill="#FFFFFF" opacity="0.85" />
  </g>
</svg>