<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="yd-base-shadow" x="-15%" y="-10%" width="130%" height="135%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#140528" flood-opacity="0.30" />
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#140528" flood-opacity="0.15" />
    </filter>
    <filter id="yd-elem-shadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#0E031E" flood-opacity="0.35" />
    </filter>

    <linearGradient id="yd-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#6D28D9" />
      <stop offset="100%" stop-color="#4C1D95" />
    </linearGradient>

    <linearGradient id="yd-window" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#EDF2F7" />
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="url(#yd-bg)" filter="url(#yd-base-shadow)" />

  <g transform="translate(256, 256) scale(0.76) translate(-256, -256)" filter="url(#yd-elem-shadow)">
    <!-- 3D Frosted Dialog Window -->
    <rect x="108" y="108" width="296" height="296" rx="44" fill="url(#yd-window)" stroke="#FFFFFF" stroke-width="2.5" />

    <!-- Window Header Bar with 3 Dots -->
    <rect x="108" y="108" width="296" height="54" rx="44" fill="#DCE5F2" />
    <rect x="108" y="138" width="296" height="24" fill="#DCE5F2" />
    <circle cx="146" cy="135" r="8" fill="#FF5F56" />
    <circle cx="170" cy="135" r="8" fill="#FFBD2E" />
    <circle cx="194" cy="135" r="8" fill="#27C93F" />

    <!-- Interactive UI Dialog Elements (Sliders & Switches) -->
    <!-- Slider Track 1 (Violet) -->
    <rect x="146" y="196" width="220" height="14" rx="7" fill="#C4B5FD" />
    <rect x="146" y="196" width="140" height="14" rx="7" fill="#7C3AED" />
    <circle cx="286" cy="203" r="16" fill="#FFFFFF" stroke="#7C3AED" stroke-width="4" filter="url(#yd-elem-shadow)" />

    <!-- Slider Track 2 (Teal) -->
    <rect x="146" y="254" width="220" height="14" rx="7" fill="#A7F3D0" />
    <rect x="146" y="254" width="80" height="14" rx="7" fill="#10B981" />
    <circle cx="226" cy="261" r="16" fill="#FFFFFF" stroke="#10B981" stroke-width="4" filter="url(#yd-elem-shadow)" />

    <!-- Dialog Action Buttons -->
    <rect x="146" y="316" width="100" height="42" rx="16" fill="#E2E8F0" />
    <rect x="266" y="316" width="100" height="42" rx="16" fill="#6D28D9" />
    <rect x="286" y="332" width="60" height="10" rx="5" fill="#FFFFFF" />
  </g>

  <!-- Outer Squircle Rim Highlight -->
  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="3" />
</svg>
