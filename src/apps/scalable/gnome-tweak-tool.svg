<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="gt-base-shadow" x="-15%" y="-10%" width="130%" height="135%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#040810" flood-opacity="0.28" />
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#040810" flood-opacity="0.14" />
    </filter>
    <filter id="gt-elem-shadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#001830" flood-opacity="0.35" />
    </filter>

    <linearGradient id="gt-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#283244" />
      <stop offset="50%" stop-color="#18202D" />
      <stop offset="100%" stop-color="#0C1017" />
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="url(#gt-bg)" filter="url(#gt-base-shadow)" />

  <g transform="translate(256, 256) scale(0.82) translate(-256, -256)" filter="url(#gt-elem-shadow)">
    <!-- 3 Precision Slider Tracks -->
    <!-- Track 1: Cyan -->
    <rect x="124" y="160" width="264" height="16" rx="8" fill="#141E2B" stroke="#364962" stroke-width="1.5" />
    <rect x="124" y="160" width="168" height="16" rx="8" fill="#00E5FF" />
    <circle cx="292" cy="168" r="22" fill="#FFFFFF" stroke="#00E5FF" stroke-width="5" filter="url(#gt-elem-shadow)" />

    <!-- Track 2: Orange/Amber -->
    <rect x="124" y="248" width="264" height="16" rx="8" fill="#141E2B" stroke="#364962" stroke-width="1.5" />
    <rect x="124" y="248" width="94" height="16" rx="8" fill="#FF9100" />
    <circle cx="218" cy="256" r="22" fill="#FFFFFF" stroke="#FF9100" stroke-width="5" filter="url(#gt-elem-shadow)" />

    <!-- Track 3: Emerald/Green -->
    <rect x="124" y="336" width="264" height="16" rx="8" fill="#141E2B" stroke="#364962" stroke-width="1.5" />
    <rect x="124" y="336" width="210" height="16" rx="8" fill="#00E676" />
    <circle cx="334" cy="344" r="22" fill="#FFFFFF" stroke="#00E676" stroke-width="5" filter="url(#gt-elem-shadow)" />
  </g>

  <!-- Outer Squircle Rim Highlight -->
  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="3" />
</svg>
