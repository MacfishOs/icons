<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="tm-base-shadow" x="-15%" y="-10%" width="130%" height="135%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#05080D" flood-opacity="0.32" />
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#05080D" flood-opacity="0.16" />
    </filter>
    <filter id="tm-glow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#00E5A3" flood-opacity="0.35" />
    </filter>

    <linearGradient id="tm-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#262C38" />
      <stop offset="50%" stop-color="#161922" />
      <stop offset="100%" stop-color="#0C0E14" />
    </linearGradient>

    <linearGradient id="tm-border" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#63708A" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0F1219" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="tm-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.03" />
    </linearGradient>

    <linearGradient id="tm-prompt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5CE6FF" />
      <stop offset="100%" stop-color="#00E699" />
    </linearGradient>
  </defs>

  <!-- Full-Canvas Squircle Base (480x480 rx=110) -->
  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="url(#tm-bg)" stroke="url(#tm-border)" stroke-width="3" filter="url(#tm-base-shadow)" />

  <g transform="translate(256, 256) scale(1.12) translate(-256, -256)">
    <!-- Frosted Glass Inner Terminal Frame -->
    <rect x="84" y="84" width="344" height="344" rx="68" ry="68" fill="url(#tm-card)" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="2" />

    <!-- macOS Traffic Light Dots -->
    <circle cx="132" cy="128" r="10" fill="#FF5F56" opacity="0.9" />
    <circle cx="164" cy="128" r="10" fill="#FFBD2E" opacity="0.9" />
    <circle cx="196" cy="128" r="10" fill="#27C93F" opacity="0.9" />

    <!-- Glowing Command Prompt (>_) -->
    <g filter="url(#tm-glow)">
      <path d="M 138 206 L 208 258 L 138 310" fill="none" stroke="url(#tm-prompt)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />

      <rect x="236" y="294" width="84" height="28" rx="14" fill="#FFFFFF" opacity="0.95" />
    </g>
  </g>
</svg>