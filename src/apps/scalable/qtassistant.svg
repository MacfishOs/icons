<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="qa-base-shadow" x="-15%" y="-10%" width="130%" height="135%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#021C08" flood-opacity="0.28" />
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#021C08" flood-opacity="0.14" />
    </filter>
    <filter id="qa-elem-shadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#010E04" flood-opacity="0.35" />
    </filter>

    <linearGradient id="qa-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#41CD52" />
      <stop offset="50%" stop-color="#21A034" />
      <stop offset="100%" stop-color="#0E6B20" />
    </linearGradient>

    <linearGradient id="qa-book" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" /><stop offset="100%" stop-color="#E2F5E6" />
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="url(#qa-bg)" filter="url(#qa-base-shadow)" />

  <g transform="translate(256, 256) scale(0.76) translate(-256, -256)" filter="url(#qa-elem-shadow)">
    <!-- Open Reference Handbook -->
    <path d="M 124 168 C 176 152, 236 172, 256 188 C 276 172, 336 152, 388 168 V 360 C 336 344, 276 364, 256 380 C 236 364, 176 344, 124 360 Z"
          fill="url(#qa-book)" stroke="#FFFFFF" stroke-width="2.5" />

    <!-- Center Help Question Beacon '?' -->
    <text x="256" y="304" font-family="system-ui, -apple-system, sans-serif" font-size="112" font-weight="900" fill="#21A034" text-anchor="middle">?</text>
  </g>

  <!-- Outer Squircle Rim Highlight -->
  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="3" />
</svg>
