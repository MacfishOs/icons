<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="gh-base-shadow" x="-15%" y="-10%" width="130%" height="135%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#140307" flood-opacity="0.32" />
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#140307" flood-opacity="0.16" />
    </filter>
    <filter id="gh-elem-shadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <linearGradient id="gh-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#281D24" />
      <stop offset="50%" stop-color="#181217" />
      <stop offset="100%" stop-color="#0E0B0E" />
    </linearGradient>

    <linearGradient id="gh-border" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF4760" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#181217" stop-opacity="0.9" />
    </linearGradient>

    <!-- Primary Crimson-Orange Dragon Neck & Head -->
    <linearGradient id="gh-dragon-main" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5E36" />
      <stop offset="50%" stop-color="#F21B3F" />
      <stop offset="100%" stop-color="#9E0B28" />
    </linearGradient>

    <!-- Translucent Glass Crest & Wing -->
    <linearGradient id="gh-dragon-wing" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF1E42" stop-opacity="0.80" />
      <stop offset="100%" stop-color="#FF9E2C" stop-opacity="0.88" />
    </linearGradient>

    <!-- HarmonyOS Binary Analysis Ring -->
    <linearGradient id="gh-cyber-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#FF2A54" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- macOS Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="url(#gh-bg)" stroke="url(#gh-border)" stroke-width="3" filter="url(#gh-base-shadow)" />

  <!-- Calibrated Glyph Group (Scale 0.78) -->
  <g transform="translate(256, 256) scale(0.78) translate(-256, -256)">

  <!-- Subtle Disassembly Radar Ring -->
  <circle cx="256" cy="256" r="154" fill="none" stroke="url(#gh-cyber-ring)" stroke-width="2.5" stroke-dasharray="18 10 4 10" />

  <g filter="url(#gh-elem-shadow)">
    <!-- Back Translucent Amber-Crimson Wing Fin -->
    <path d="M 140 336
             C 122 256, 158 164, 236 122
             C 218 168, 226 214, 266 244
             C 210 256, 174 292, 140 336 Z" fill="url(#gh-dragon-wing)" stroke="#FFD1B3" stroke-opacity="0.55" stroke-width="2" />

    <!-- Sculpted Dragon S-Curve Head, Jaw & Coiled Neck -->
    <path d="M 218 138
             C 268 112, 336 126, 376 168
             L 322 184
             L 364 212
             C 332 232, 292 226, 266 206
             C 246 226, 258 262, 294 282
             C 344 308, 366 364, 326 394
             C 286 422, 196 410, 156 366
             C 208 372, 266 356, 268 322
             C 270 292, 214 274, 196 232
             C 182 198, 192 152, 218 138 Z" fill="url(#gh-dragon-main)" stroke="#FF9E9E" stroke-opacity="0.65" stroke-width="2.5" />

    <!-- Glowing Cyber-Cyan Dragon Eye -->
    <polygon points="282,162 308,156 296,174" fill="#00F5FF" />
  </g>
  </g>
</svg>