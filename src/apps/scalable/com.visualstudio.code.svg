<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="vs-base-shadow" x="-15%" y="-10%" width="130%" height="135%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#06162E" flood-opacity="0.22" />
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#06162E" flood-opacity="0.10" />
    </filter>
    <filter id="vs-ribbon-shadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#002B66" flood-opacity="0.22" />
    </filter>

    <linearGradient id="vs-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F0F6FF" />
      <stop offset="100%" stop-color="#D9E8FF" />
    </linearGradient>

    <linearGradient id="vs-border" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#ADC8F0" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="vs-bottom-wing" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0052CC" />
      <stop offset="100%" stop-color="#007ACC" />
    </linearGradient>

    <linearGradient id="vs-top-wing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38B6FF" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#0066FF" stop-opacity="0.88" />
    </linearGradient>

    <linearGradient id="vs-pillar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5CE1E6" stop-opacity="0.88" />
      <stop offset="50%" stop-color="#2998FF" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#005CE6" stop-opacity="0.96" />
    </linearGradient>
  </defs>

  <!-- macOS Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="url(#vs-bg)" stroke="url(#vs-border)" stroke-width="3" filter="url(#vs-base-shadow)" />

  <!-- Inner Artwork Scaled & Centered to Fill Dock Slot -->
  <g transform="translate(256, 256) scale(0.95) translate(-256, -256)">
    <g filter="url(#vs-ribbon-shadow)">
      <path d="M 122 316 C 110 304, 110 286, 122 274 L 308 118 C 324 105, 348 114, 348 136 V 198 L 166 346 C 152 356, 134 328, 122 316 Z" fill="url(#vs-bottom-wing)" />
      <path d="M 122 196 C 110 208, 110 226, 122 238 L 308 394 C 324 407, 348 398, 348 376 V 314 L 166 166 C 152 156, 134 184, 122 196 Z" fill="url(#vs-top-wing)" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="2" />
      <path d="M 306 122 C 306 108, 322 100, 336 108 L 382 134 C 394 141, 402 154, 402 168 V 344 C 402 358, 394 371, 382 378 L 336 404 C 322 412, 306 404, 306 390 Z" fill="url(#vs-pillar)" stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="2.5" />
    </g>
  </g>
</svg>