<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="vm-base-shadow" x="-15%" y="-10%" width="130%" height="135%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#040810" flood-opacity="0.30" />
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#040810" flood-opacity="0.15" />
    </filter>
    <filter id="vm-elem-shadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#001830" flood-opacity="0.38" />
    </filter>

    <linearGradient id="vm-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#243852" />
      <stop offset="50%" stop-color="#142132" />
      <stop offset="100%" stop-color="#080F17" />
    </linearGradient>

    <linearGradient id="vm-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4" /><stop offset="100%" stop-color="#0099FF" />
    </linearGradient>
    <linearGradient id="vm-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD600" /><stop offset="100%" stop-color="#FF6D00" />
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="url(#vm-bg)" filter="url(#vm-base-shadow)" />

  <g transform="translate(256, 256) scale(0.88) translate(-256, -256)" filter="url(#vm-elem-shadow)">
    <!-- 3 Stacked Holographic Virtual Machine Layers -->
    <!-- Layer 1: Bottom (Dark Blue) -->
    <polygon points="256,310 380,360 256,410 132,360" fill="#0052CC" opacity="0.6" stroke="#40A0FF" stroke-width="2" />

    <!-- Layer 2: Middle (Cyan Acrylic) -->
    <polygon points="256,240 380,290 256,340 132,290" fill="#00B4D8" opacity="0.65" stroke="#00F5D4" stroke-width="2" />

    <!-- Layer 3: Top Hypervisor Master Card -->
    <g transform="translate(0, -30)">
      <polygon points="256,200 380,250 256,300 132,250" fill="#FFFFFF" fill-opacity="0.9" stroke="#FFFFFF" stroke-width="2.5" />
      <!-- VM Console Terminal on top -->
      <polygon points="256,120 380,170 380,230 256,280 132,230 132,170" fill="url(#vm-bg)" stroke="#00F5D4" stroke-width="2.5" />
      <circle cx="164" cy="184" r="5" fill="#FF5252" />
      <circle cx="180" cy="189" r="5" fill="#FFD600" />
      <circle cx="196" cy="194" r="5" fill="#00E676" />
      <line x1="164" y1="214" x2="224" y2="236" stroke="#00F5D4" stroke-width="4" stroke-linecap="round" />
    </g>
  </g>

  <!-- Outer Squircle Rim Highlight -->
  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="3" />
</svg>
