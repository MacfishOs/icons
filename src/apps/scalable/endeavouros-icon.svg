<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="eos-base-shadow" x="-15%" y="-10%" width="130%" height="135%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0E0521" flood-opacity="0.30" />
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0E0521" flood-opacity="0.15" />
    </filter>
    <filter id="eos-glow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1A0538" flood-opacity="0.45" />
    </filter>

    <linearGradient id="eos-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#28114A" />
      <stop offset="50%" stop-color="#17072E" />
      <stop offset="100%" stop-color="#0B0217" />
    </linearGradient>

    <!-- EndeavourOS Red/Crimson Left Wing -->
    <linearGradient id="eos-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4C6A" />
      <stop offset="100%" stop-color="#D9163D" />
    </linearGradient>

    <!-- EndeavourOS Cyan/Blue Center Arc -->
    <linearGradient id="eos-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#40DCFF" />
      <stop offset="100%" stop-color="#0077D4" />
    </linearGradient>

    <!-- EndeavourOS Violet/Purple Right Wing -->
    <linearGradient id="eos-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C05CFF" />
      <stop offset="100%" stop-color="#7B1FA2" />
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="url(#eos-bg)" filter="url(#eos-base-shadow)" />

  <g transform="translate(256, 256) scale(0.88) translate(-256, -256)" filter="url(#eos-glow)">
    <!-- Nebula Ambient Ring -->
    <circle cx="256" cy="256" r="160" fill="none" stroke="#A855F7" stroke-opacity="0.14" stroke-width="2" />

    <!-- Iconic EndeavourOS Tri-Sails in 3D Frosted Glass -->
    <!-- Left Red Wing -->
    <path d="M 238 108 C 218 178, 148 274, 114 308 C 160 318, 222 288, 238 238 Z"
          fill="url(#eos-red)" stroke="#FFA3B5" stroke-opacity="0.6" stroke-width="2" />

    <!-- Center Soaring Cyan Core Sail -->
    <path d="M 256 94 C 274 168, 334 290, 396 358 C 342 366, 268 336, 248 244 Z"
          fill="url(#eos-cyan)" stroke="#B3F2FF" stroke-opacity="0.75" stroke-width="2.5" />

    <!-- Right Trailing Violet Sail -->
    <path d="M 248 244 C 272 312, 338 376, 388 404 C 330 412, 230 382, 196 322 Z"
          fill="url(#eos-purple)" stroke="#E9B8FF" stroke-opacity="0.6" stroke-width="2" />

    <!-- Starlight Specular Glint -->
    <circle cx="256" cy="94" r="8" fill="#FFFFFF" />
    <circle cx="256" cy="94" r="16" fill="#40DCFF" opacity="0.4" />
  </g>

  <!-- Outer Squircle Rim Highlight -->
  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="3" />
</svg>
