<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="rd-base-shadow" x="-15%" y="-10%" width="130%" height="135%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#020E21" flood-opacity="0.30" />
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#020E21" flood-opacity="0.15" />
    </filter>
    <filter id="rd-elem-shadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#010712" flood-opacity="0.38" />
    </filter>

    <linearGradient id="rd-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#144682" />
      <stop offset="50%" stop-color="#0A2C57" />
      <stop offset="100%" stop-color="#03152E" />
    </linearGradient>

    <linearGradient id="rd-screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" /><stop offset="100%" stop-color="#D6E5F7" />
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="url(#rd-bg)" filter="url(#rd-base-shadow)" />

  <g transform="translate(256, 256) scale(0.82) translate(-256, -256)" filter="url(#rd-elem-shadow)">
    <!-- Primary Host Display Screen (Back) -->
    <g transform="translate(40, -30)">
      <rect x="156" y="132" width="200" height="140" rx="20" fill="#0C203E" stroke="#508CD6" stroke-width="3" />
      <line x1="256" y1="272" x2="256" y2="304" stroke="#508CD6" stroke-width="8" />
      <rect x="220" y="304" width="72" height="10" rx="5" fill="#508CD6" />
    </g>

    <!-- Client Laptop / Remote Display (Front) -->
    <rect x="116" y="196" width="220" height="152" rx="22" fill="url(#rd-screen)" stroke="#FFFFFF" stroke-width="3" filter="url(#rd-elem-shadow)" />
    <!-- Stand -->
    <polygon points="176,348 276,348 296,378 156,378" fill="#B0C8E8" stroke="#FFFFFF" stroke-width="1.5" />

    <!-- Remote Connection Sync Nodes -->
    <circle cx="226" cy="272" r="28" fill="#00A2FF" />
    <path d="M 214 262 L 238 272 L 214 282 Z" fill="#FFFFFF" />
    <!-- Signal Arcs -->
    <path d="M 276 252 A 28 28 0 0 1 276 292" fill="none" stroke="#00E5FF" stroke-width="5" stroke-linecap="round" />
    <path d="M 292 242 A 44 44 0 0 1 292 302" fill="none" stroke="#00E5FF" stroke-width="5" stroke-linecap="round" opacity="0.7" />
  </g>

  <!-- Outer Squircle Rim Highlight -->
  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="3" />
</svg>
