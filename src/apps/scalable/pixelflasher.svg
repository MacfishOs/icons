<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="pf-base-shadow" x="-15%" y="-10%" width="130%" height="135%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#020814" flood-opacity="0.30" />
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#020814" flood-opacity="0.15" />
    </filter>
    <filter id="pf-elem-shadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#001830" flood-opacity="0.40" />
    </filter>

    <linearGradient id="pf-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#222C3D" />
      <stop offset="50%" stop-color="#141B26" />
      <stop offset="100%" stop-color="#0A0E14" />
    </linearGradient>

    <linearGradient id="pf-flash" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4" />
      <stop offset="50%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#0066FF" />
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="url(#pf-bg)" filter="url(#pf-base-shadow)" />

  <g transform="translate(256, 256) scale(0.82) translate(-256, -256)" filter="url(#pf-elem-shadow)">
    <!-- Smartphone Frame Outline -->
    <rect x="144" y="88" width="224" height="336" rx="36" fill="#182230" stroke="#7A94B8" stroke-width="4" />
    <!-- Pixel Camera Visor Bar -->
    <rect x="144" y="128" width="224" height="48" fill="#0C121A" />
    <circle cx="216" cy="152" r="14" fill="#00E5FF" opacity="0.8" />
    <circle cx="256" cy="152" r="10" fill="#00E5FF" opacity="0.6" />

    <!-- Radiant Lightning Bolt Flash -->
    <polygon points="268,188 196,300 248,300 228,392 316,280 264,280" fill="url(#pf-flash)" stroke="#FFFFFF" stroke-width="3" filter="url(#pf-elem-shadow)" />
  </g>

  <!-- Outer Squircle Rim Highlight -->
  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="3" />
</svg>
