<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="hw-base-shadow" x="-15%" y="-10%" width="130%" height="135%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#021410" flood-opacity="0.28" />
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#021410" flood-opacity="0.14" />
    </filter>
    <filter id="hw-elem-shadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#010A08" flood-opacity="0.35" />
    </filter>

    <linearGradient id="hw-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A3830" />
      <stop offset="50%" stop-color="#0E221D" />
      <stop offset="100%" stop-color="#05100D" />
    </linearGradient>

    <linearGradient id="hw-chip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3B36" />
      <stop offset="100%" stop-color="#151C1A" />
    </linearGradient>

    <linearGradient id="hw-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="100%" stop-color="#FFB300" />
    </linearGradient>

    <linearGradient id="hw-core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4" />
      <stop offset="100%" stop-color="#00A896" />
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="url(#hw-bg)" filter="url(#hw-base-shadow)" />

  <g transform="translate(256, 256) scale(0.85) translate(-256, -256)" filter="url(#hw-elem-shadow)">
    <!-- Golden Peripheral Connector Pins -->
    <g fill="url(#hw-gold)">
      <!-- Top pins -->
      <rect x="156" y="86" width="12" height="26" rx="3" /><rect x="188" y="86" width="12" height="26" rx="3" /><rect x="220" y="86" width="12" height="26" rx="3" /><rect x="252" y="86" width="12" height="26" rx="3" /><rect x="284" y="86" width="12" height="26" rx="3" /><rect x="316" y="86" width="12" height="26" rx="3" /><rect x="348" y="86" width="12" height="26" rx="3" />
      <!-- Bottom pins -->
      <rect x="156" y="400" width="12" height="26" rx="3" /><rect x="188" y="400" width="12" height="26" rx="3" /><rect x="220" y="400" width="12" height="26" rx="3" /><rect x="252" y="400" width="12" height="26" rx="3" /><rect x="284" y="400" width="12" height="26" rx="3" /><rect x="316" y="400" width="12" height="26" rx="3" /><rect x="348" y="400" width="12" height="26" rx="3" />
      <!-- Left pins -->
      <rect x="86" y="156" width="26" height="12" rx="3" /><rect x="86" y="188" width="26" height="12" rx="3" /><rect x="86" y="220" width="26" height="12" rx="3" /><rect x="86" y="252" width="26" height="12" rx="3" /><rect x="86" y="284" width="26" height="12" rx="3" /><rect x="86" y="316" width="26" height="12" rx="3" /><rect x="86" y="348" width="26" height="12" rx="3" />
      <!-- Right pins -->
      <rect x="400" y="156" width="26" height="12" rx="3" /><rect x="400" y="188" width="26" height="12" rx="3" /><rect x="400" y="220" width="26" height="12" rx="3" /><rect x="400" y="252" width="26" height="12" rx="3" /><rect x="400" y="284" width="26" height="12" rx="3" /><rect x="400" y="316" width="26" height="12" rx="3" /><rect x="400" y="348" width="26" height="12" rx="3" />
    </g>

    <!-- Ceramic Integrated Circuit Carrier -->
    <rect x="108" y="108" width="296" height="296" rx="42" fill="url(#hw-chip)" stroke="#4A6158" stroke-width="2.5" />

    <!-- 4 CPU Core Tiles Topology Grid -->
    <rect x="156" y="156" width="90" height="90" rx="18" fill="url(#hw-core)" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="2" />
    <rect x="266" y="156" width="90" height="90" rx="18" fill="url(#hw-core)" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="2" />
    <rect x="156" y="266" width="90" height="90" rx="18" fill="url(#hw-core)" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="2" />
    <rect x="266" y="266" width="90" height="90" rx="18" fill="url(#hw-core)" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="2" />

    <!-- Interconnect Cross Bus -->
    <line x1="156" y1="256" x2="356" y2="256" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
    <line x1="256" y1="156" x2="256" y2="356" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
    <circle cx="256" cy="256" r="16" fill="#FFFFFF" stroke="#00F5D4" stroke-width="3" />
  </g>

  <!-- Outer Squircle Rim Highlight -->
  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="3" />
</svg>
