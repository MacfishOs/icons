<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="pv-base-shadow" x="-15%" y="-10%" width="130%" height="135%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#100524" flood-opacity="0.30" />
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#100524" flood-opacity="0.15" />
    </filter>
    <filter id="pv-elem-shadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#080214" flood-opacity="0.38" />
    </filter>

    <linearGradient id="pv-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#281A4E" />
      <stop offset="50%" stop-color="#180D33" />
      <stop offset="100%" stop-color="#0B041C" />
    </linearGradient>

    <!-- Proton Tri-fold Prism -->
    <linearGradient id="pv-prism" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8E44EC" />
      <stop offset="50%" stop-color="#6D30DE" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="url(#pv-bg)" filter="url(#pv-base-shadow)" />

  <g transform="translate(256, 256) scale(0.78) translate(-256, -256)" filter="url(#pv-elem-shadow)">
    <!-- Encrypted VPN Target Sonar -->
    <circle cx="256" cy="256" r="162" fill="none" stroke="#6D30DE" stroke-opacity="0.25" stroke-width="2" />

    <!-- 3D Proton Shield / Triangle -->
    <path d="M 256 104 C 330 148, 388 200, 388 280 C 388 356, 316 408, 256 424 C 196 408, 124 356, 124 280 C 124 200, 182 148, 256 104 Z"
          fill="url(#pv-prism)" stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="2.5" />

    <!-- Inner Protective Padlock Keyhole -->
    <rect x="228" y="272" width="56" height="52" rx="14" fill="#FFFFFF" />
    <path d="M 238 272 V 246 C 238 236, 246 228, 256 228 C 266 228, 274 236, 274 246 V 272" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" />
    <circle cx="256" cy="294" r="6" fill="#180D33" />
    <line x1="256" y1="298" x2="256" y2="312" stroke="#180D33" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Outer Squircle Rim Highlight -->
  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="3" />
</svg>
