<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="kv-base-shadow" x="-15%" y="-10%" width="130%" height="135%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#001814" flood-opacity="0.30" />
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#001814" flood-opacity="0.15" />
    </filter>
    <filter id="kv-elem-shadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000A08" flood-opacity="0.40" />
    </filter>

    <linearGradient id="kv-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#005B52" />
      <stop offset="50%" stop-color="#003D37" />
      <stop offset="100%" stop-color="#001E1B" />
    </linearGradient>

    <linearGradient id="kv-crystal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4" />
      <stop offset="50%" stop-color="#00BCD4" />
      <stop offset="100%" stop-color="#006064" />
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="url(#kv-bg)" filter="url(#kv-base-shadow)" />

  <g transform="translate(256, 256) scale(0.85) translate(-256, -256)" filter="url(#kv-elem-shadow)">
    <!-- 3D Faceted Quantum Crystal Prism -->
    <!-- Top Face -->
    <polygon points="256,110 376,180 256,250 136,180" fill="url(#kv-crystal)" stroke="#FFFFFF" stroke-width="2.5" />
    <!-- Left Face -->
    <polygon points="136,180 256,250 256,390 136,320" fill="#00796B" stroke="#80CBC4" stroke-width="1.5" />
    <!-- Right Face -->
    <polygon points="376,180 256,250 256,390 376,320" fill="#004D40" stroke="#80CBC4" stroke-width="1.5" />

    <!-- Glowing Quantum Energy Center Node -->
    <circle cx="256" cy="250" r="18" fill="#FFFFFF" filter="url(#kv-elem-shadow)" />
    <circle cx="256" cy="250" r="32" fill="#00F5D4" opacity="0.35" />
  </g>

  <!-- Outer Squircle Rim Highlight -->
  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="3" />
</svg>
