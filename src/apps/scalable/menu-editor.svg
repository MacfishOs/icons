<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="me-base-shadow" x="-15%" y="-10%" width="130%" height="135%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#021430" flood-opacity="0.28" />
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#021430" flood-opacity="0.14" />
    </filter>
    <filter id="me-elem-shadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#010A1A" flood-opacity="0.35" />
    </filter>

    <linearGradient id="me-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E88E5" />
      <stop offset="50%" stop-color="#1565C0" />
      <stop offset="100%" stop-color="#0B3778" />
    </linearGradient>

    <linearGradient id="me-tool" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD54F" />
      <stop offset="100%" stop-color="#FF8F00" />
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="url(#me-bg)" filter="url(#me-base-shadow)" />

  <g transform="translate(256, 256) scale(0.82) translate(-256, -256)" filter="url(#me-elem-shadow)">
    <!-- 3x3 App Launcher Menu Tiles -->
    <g fill="#FFFFFF" fill-opacity="0.28" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="2">
      <rect x="130" y="130" width="64" height="64" rx="20" />
      <rect x="224" y="130" width="64" height="64" rx="20" />
      <rect x="318" y="130" width="64" height="64" rx="20" />

      <rect x="130" y="224" width="64" height="64" rx="20" />
      <rect x="224" y="224" width="64" height="64" rx="20" />
      <rect x="318" y="224" width="64" height="64" rx="20" />

      <rect x="130" y="318" width="64" height="64" rx="20" />
      <rect x="224" y="318" width="64" height="64" rx="20" />
      <rect x="318" y="318" width="64" height="64" rx="20" fill="url(#me-tool)" fill-opacity="1" />
    </g>

    <!-- Floating 3D Config Pencil/Wrench -->
    <g transform="translate(320, 260) rotate(-35) translate(-30, -50)" filter="url(#me-elem-shadow)">
      <rect x="18" y="0" width="24" height="110" rx="12" fill="#FFFFFF" stroke="#1565C0" stroke-width="2" />
      <polygon points="18,110 30,140 42,110" fill="url(#me-tool)" />
      <rect x="18" y="20" width="24" height="12" fill="#FF5252" />
    </g>
  </g>

  <!-- Outer Squircle Rim Highlight -->
  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="3" />
</svg>
