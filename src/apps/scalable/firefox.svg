<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="ff-base-shadow" x="-15%" y="-10%" width="130%" height="135%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0E0521" flood-opacity="0.30" />
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0E0521" flood-opacity="0.15" />
    </filter>
    <filter id="ff-glow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1A052E" flood-opacity="0.4" />
    </filter>

    <linearGradient id="ff-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#261447" />
      <stop offset="55%" stop-color="#170B30" />
      <stop offset="100%" stop-color="#0D061C" />
    </linearGradient>

    <linearGradient id="ff-border" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8C52FF" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#170B30" stop-opacity="0.9" />
    </linearGradient>

    <!-- Inner Planetary Core -->
    <linearGradient id="ff-globe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B538FF" />
      <stop offset="50%" stop-color="#6B2CF5" />
      <stop offset="100%" stop-color="#29127D" />
    </linearGradient>

    <!-- Outer Flame Ribbon (Crimson -> Orange -> Gold) -->
    <linearGradient id="ff-tail-main" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2957" stop-opacity="0.94" />
      <stop offset="50%" stop-color="#FF7714" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#FFDD33" stop-opacity="0.95" />
    </linearGradient>

    <!-- Inner Overlapping Translucent Gold Petal -->
    <linearGradient id="ff-tail-inner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF066" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#FF5500" stop-opacity="0.78" />
    </linearGradient>
  </defs>

  <!-- macOS Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="url(#ff-bg)" stroke="url(#ff-border)" stroke-width="3" filter="url(#ff-base-shadow)" />

  <!-- Calibrated Glyph Group (Scale 0.95) -->
  <g transform="translate(256, 256) scale(0.95) translate(-256, -256)">

  <g filter="url(#ff-glow)">
    <!-- Deep Violet-Indigo Globe Core -->
    <circle cx="256" cy="262" r="108" fill="url(#ff-globe)" stroke="#D68FFF" stroke-opacity="0.5" stroke-width="2" />

    <!-- Specular Shine on Globe -->
    <ellipse cx="226" cy="210" rx="52" ry="28" transform="rotate(-25 226 210)" fill="#FFFFFF" opacity="0.22" />

    <!-- HarmonyOS Sweeping Glassmorphic Fox Tail -->
    <path d="M 276 112
             C 362 122, 412 198, 398 282
             C 384 366, 306 416, 222 402
             C 138 388, 98 312, 118 228
             C 128 184, 162 152, 198 144
             C 172 178, 168 228, 194 264
             C 224 306, 286 312, 322 274
             C 350 244, 348 192, 314 162
             C 302 151, 286 144, 276 112 Z" fill="url(#ff-tail-main)" stroke="#FFF2B2" stroke-opacity="0.65" stroke-width="2.5" />

    <!-- Secondary Translucent Flame Crest -->
    <path d="M 332 138
             C 386 176, 404 252, 372 316
             C 340 380, 262 406, 198 378
             C 256 382, 314 344, 328 286
             C 340 236, 316 184, 332 138 Z" fill="url(#ff-tail-inner)" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="1.5" />
  </g>
  </g>
</svg>