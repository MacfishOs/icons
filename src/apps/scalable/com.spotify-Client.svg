<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="sp-base-shadow" x="-15%" y="-10%" width="130%" height="135%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#031208" flood-opacity="0.32" />
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#031208" flood-opacity="0.16" />
    </filter>
    <filter id="sp-elem-shadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#00240E" flood-opacity="0.35" />
    </filter>

    <linearGradient id="sp-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E2822" />
      <stop offset="55%" stop-color="#121714" />
      <stop offset="100%" stop-color="#0A0D0B" />
    </linearGradient>

    <linearGradient id="sp-border" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3AE67A" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#0E1410" stop-opacity="0.9" />
    </linearGradient>

    <!-- HarmonyOS Translucent Emerald Sphere -->
    <linearGradient id="sp-sphere" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2AF584" />
      <stop offset="50%" stop-color="#1ED760" />
      <stop offset="100%" stop-color="#0B8C3B" />
    </linearGradient>

    <linearGradient id="sp-wave-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#D4FFE4" stop-opacity="0.82" />
    </linearGradient>
  </defs>

  <!-- Full-Canvas Squircle Base (Matches VS Code 480x480 rx=110) -->
  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="url(#sp-bg)" stroke="url(#sp-border)" stroke-width="3" filter="url(#sp-base-shadow)" />

  <g transform="translate(256, 256) scale(1.12) translate(-256, -256)">
    <!-- Subtle Acoustic Vinyl Grooves -->
    <circle cx="256" cy="256" r="182" fill="none" stroke="#1ED760" stroke-opacity="0.12" stroke-width="2" />
    <circle cx="256" cy="256" r="164" fill="none" stroke="#1ED760" stroke-opacity="0.08" stroke-width="1.5" />

    <!-- HarmonyOS Glowing Green Disc -->
    <circle cx="256" cy="256" r="144" fill="url(#sp-sphere)" stroke="#A3FFC6" stroke-opacity="0.65" stroke-width="2.5" filter="url(#sp-elem-shadow)" />

    <!-- Top Acrylic Gloss Reflection -->
    <ellipse cx="256" cy="168" rx="96" ry="44" fill="#FFFFFF" opacity="0.22" />

    <!-- 3D Frosted Sound Waves -->
    <g filter="url(#sp-elem-shadow)" fill="none" stroke="url(#sp-wave-glass)" stroke-linecap="round">
      <path d="M 168 214 C 222 194, 298 198, 348 226" stroke-width="26" />
      <path d="M 182 262 C 228 245, 286 248, 328 272" stroke-width="22" opacity="0.92" />
      <path d="M 198 306 C 234 294, 276 296, 308 314" stroke-width="18" opacity="0.85" />
    </g>
  </g>
</svg>