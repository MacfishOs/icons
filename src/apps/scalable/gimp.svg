<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="gi-base-shadow" x="-15%" y="-10%" width="130%" height="135%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#140D07" flood-opacity="0.28" />
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#140D07" flood-opacity="0.14" />
    </filter>
    <filter id="gi-elem-shadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#0A0603" flood-opacity="0.35" />
    </filter>

    <linearGradient id="gi-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3A3836" />
      <stop offset="50%" stop-color="#242322" />
      <stop offset="100%" stop-color="#141312" />
    </linearGradient>

    <linearGradient id="gi-wilber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A89482" />
      <stop offset="50%" stop-color="#7C6B5C" />
      <stop offset="100%" stop-color="#4E4238" />
    </linearGradient>

    <linearGradient id="gi-brush-handle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA726" />
      <stop offset="100%" stop-color="#E65100" />
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="url(#gi-bg)" filter="url(#gi-base-shadow)" />

  <g transform="translate(256, 256) scale(0.76) translate(-256, -256)" filter="url(#gi-elem-shadow)">
    <!-- Artist Palette Rim Ambient Arc -->
    <circle cx="256" cy="256" r="158" fill="none" stroke="#FF9800" stroke-opacity="0.18" stroke-width="2.5" stroke-dasharray="14 10" />

    <!-- Wilber Head Shape -->
    <path d="M 132 232 C 122 170, 186 112, 276 112 C 362 112, 404 176, 396 248 C 390 306, 332 358, 252 358 C 172 358, 138 290, 132 232 Z"
          fill="url(#gi-wilber)" stroke="#C6B5A4" stroke-opacity="0.6" stroke-width="2.5" />

    <!-- Floppy Left Ear / Tuft -->
    <path d="M 164 156 C 114 136, 92 186, 128 226 Z" fill="#625448" />

    <!-- Large Expressive Wilber Eyes -->
    <!-- Left Eye -->
    <ellipse cx="232" cy="204" rx="34" ry="42" fill="#FFFFFF" />
    <circle cx="242" cy="208" r="18" fill="#1C1814" />
    <circle cx="236" cy="198" r="6" fill="#FFFFFF" />
    <!-- Right Eye -->
    <ellipse cx="304" cy="204" rx="34" ry="42" fill="#FFFFFF" />
    <circle cx="314" cy="208" r="18" fill="#1C1814" />
    <circle cx="308" cy="198" r="6" fill="#FFFFFF" />

    <!-- Nose -->
    <ellipse cx="272" cy="254" rx="20" ry="14" fill="#1A1612" />

    <!-- Smile line -->
    <path d="M 218 288 C 248 316, 298 316, 328 288" fill="none" stroke="#2B241E" stroke-width="6" stroke-linecap="round" />

    <!-- Artist Paintbrush clamped in mouth -->
    <g transform="translate(256, 310) rotate(-22) translate(-256, -310)">
      <!-- Brush Handle -->
      <path d="M 104 316 L 270 316 L 268 304 L 104 308 Z" fill="url(#gi-brush-handle)" stroke="#FFE0B2" stroke-width="1.5" />
      <!-- Silver Ferrule -->
      <rect x="270" y="302" width="28" height="16" rx="4" fill="#E0E6ED" stroke="#FFFFFF" stroke-width="1" />
      <!-- Dark Bristles with Vibrant Cyan/Orange Tip -->
      <path d="M 298 302 C 322 302, 348 310, 348 310 C 348 310, 322 318, 298 318 Z" fill="#00E5FF" filter="url(#gi-elem-shadow)" />
      <!-- Glowing paint drop -->
      <circle cx="356" cy="316" r="6" fill="#00E5FF" />
    </g>
  </g>

  <!-- Outer Squircle Rim Highlight -->
  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="3" />
</svg>
