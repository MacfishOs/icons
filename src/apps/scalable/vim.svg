<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="vm-base-shadow" x="-15%" y="-10%" width="130%" height="135%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#021C0E" flood-opacity="0.30" />
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#021C0E" flood-opacity="0.15" />
    </filter>
    <filter id="vm-elem-shadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#001408" flood-opacity="0.38" />
    </filter>

    <linearGradient id="vm-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E5C32" />
      <stop offset="50%" stop-color="#083D21" />
      <stop offset="100%" stop-color="#022110" />
    </linearGradient>

    <linearGradient id="vm-v-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F58A" />
      <stop offset="100%" stop-color="#00964A" />
    </linearGradient>

    <linearGradient id="vm-v-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#40DCFF" />
      <stop offset="100%" stop-color="#0066CC" />
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="url(#vm-bg)" filter="url(#vm-base-shadow)" />

  <g transform="translate(256, 256) scale(0.85) translate(-256, -256)" filter="url(#vm-elem-shadow)">
    <!-- 3D Diamond Tile Plate -->
    <rect x="176" y="176" width="160" height="160" rx="36" transform="rotate(45 256 256)" fill="#FFFFFF" fill-opacity="0.12" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="2.5" />

    <!-- Iconic Vim "V" Glyph -->
    <path d="M 136 148 H 224 L 256 312 L 288 148 H 376 L 286 376 H 226 Z" fill="url(#vm-v-left)" stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="2.5" />

    <!-- Slashed Overlay Bar -->
    <path d="M 288 148 H 376 L 308 274 H 262 Z" fill="url(#vm-v-right)" opacity="0.9" />

    <!-- Terminal Command Mode Cursor Prompt -->
    <rect x="244" y="394" width="24" height="6" rx="3" fill="#00F58A" />
  </g>

  <!-- Outer Squircle Rim Highlight -->
  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="3" />
</svg>
