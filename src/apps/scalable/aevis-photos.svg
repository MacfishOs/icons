<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="ph-base-shadow" x="-15%" y="-10%" width="130%" height="135%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0A1020" flood-opacity="0.22" />
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0A1020" flood-opacity="0.10" />
    </filter>
    <filter id="ph-petal-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.14" />
    </filter>
    <linearGradient id="ph-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" /><stop offset="60%" stop-color="#F6F8FC" /><stop offset="100%" stop-color="#E5E9F2" />
    </linearGradient>
    <linearGradient id="ph-border" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" /><stop offset="100%" stop-color="#C5CCD9" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="petal-tl" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FF3B5C" stop-opacity="0.92" /><stop offset="100%" stop-color="#FF8533" stop-opacity="0.78" /></linearGradient>
    <linearGradient id="petal-tr" x1="100%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#FFD60A" stop-opacity="0.92" /><stop offset="100%" stop-color="#FF8A00" stop-opacity="0.78" /></linearGradient>
    <linearGradient id="petal-br" x1="100%" y1="100%" x2="0%" y2="0%"><stop offset="0%" stop-color="#00D68F" stop-opacity="0.90" /><stop offset="100%" stop-color="#00B8D9" stop-opacity="0.75" /></linearGradient>
    <linearGradient id="petal-bl" x1="0%" y1="100%" x2="100%" y2="0%"><stop offset="0%" stop-color="#2B59FF" stop-opacity="0.92" /><stop offset="100%" stop-color="#9B4DFF" stop-opacity="0.78" /></linearGradient>
    <linearGradient id="glass-rim" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.75" /><stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.15" /></linearGradient>
    <linearGradient id="center-ring" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" /><stop offset="100%" stop-color="#EEF2F9" stop-opacity="0.85" /></linearGradient>
  </defs>
  <!-- Full Canvas Base -->
  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="url(#ph-bg)" stroke="url(#ph-border)" stroke-width="3" filter="url(#ph-base-shadow)" />
  <g transform="translate(256, 256) scale(1.12) translate(-256, -256)">
    <g filter="url(#ph-petal-shadow)">
      <rect x="130" y="216" width="166" height="166" rx="83" transform="rotate(-15 213 299)" fill="url(#petal-bl)" stroke="url(#glass-rim)" stroke-width="2" />
      <rect x="216" y="216" width="166" height="166" rx="83" transform="rotate(15 299 299)" fill="url(#petal-br)" stroke="url(#glass-rim)" stroke-width="2" />
      <rect x="216" y="130" width="166" height="166" rx="83" transform="rotate(-15 299 213)" fill="url(#petal-tr)" stroke="url(#glass-rim)" stroke-width="2" />
      <rect x="130" y="130" width="166" height="166" rx="83" transform="rotate(15 213 213)" fill="url(#petal-tl)" stroke="url(#glass-rim)" stroke-width="2" />
    </g>
    <circle cx="256" cy="256" r="46" fill="url(#center-ring)" stroke="#FFFFFF" stroke-width="3" filter="url(#ph-petal-shadow)" />
    <circle cx="256" cy="256" r="24" fill="#2B59FF" opacity="0.12" />
    <circle cx="248" cy="248" r="8" fill="#FFFFFF" opacity="0.9" />
  </g>
</svg>