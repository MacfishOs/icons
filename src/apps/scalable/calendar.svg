<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="cal-base-shadow" x="-15%" y="-10%" width="130%" height="135%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0A1020" flood-opacity="0.22" />
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0A1020" flood-opacity="0.10" />
    </filter>
    <filter id="cal-elem-shadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#1D2433" flood-opacity="0.16" />
    </filter>

    <!-- Exact 480x480 Squircle Clip Path (Isolated from scaling) -->
    <clipPath id="cal-squircle-clip">
      <rect x="16" y="16" width="480" height="480" rx="110" ry="110" />
    </clipPath>

    <linearGradient id="cal-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="65%" stop-color="#F4F6FA" />
      <stop offset="100%" stop-color="#E1E6F0" />
    </linearGradient>

    <linearGradient id="cal-header" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4757" />
      <stop offset="50%" stop-color="#FF2E4C" />
      <stop offset="100%" stop-color="#E01A38" />
    </linearGradient>

    <linearGradient id="cal-header-shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="cal-ring" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#D5DCE8" />
    </linearGradient>

    <linearGradient id="cal-num" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#252B3B" />
      <stop offset="100%" stop-color="#0F131C" />
    </linearGradient>
  </defs>

  <!-- Full-Canvas Squircle Base (480x480 rx=110) -->
  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="url(#cal-bg)" filter="url(#cal-base-shadow)" />

  <!-- Clipped Header Layers (Unscaled Clip Group so corners never bleed) -->
  <g clip-path="url(#cal-squircle-clip)">
    <rect x="0" y="16" width="512" height="162" fill="#000000" opacity="0.12" transform="translate(0, 6)" />
    <rect x="0" y="16" width="512" height="156" fill="url(#cal-header)" />
    <circle cx="426" cy="54" r="120" fill="url(#cal-header-shine)" />
    <circle cx="96" cy="172" r="95" fill="url(#cal-header-shine)" />
  </g>

  <!-- Scaled Binder Rings & Typography -->
  <g transform="translate(256, 256) scale(0.85) translate(-256, -256)">
    <circle cx="164" cy="186" r="16" fill="#B8253A" opacity="0.45" />
    <rect x="152" y="142" width="24" height="54" rx="12" fill="url(#cal-ring)" stroke="#FFFFFF" stroke-width="1.5" filter="url(#cal-elem-shadow)" />

    <circle cx="348" cy="186" r="16" fill="#B8253A" opacity="0.45" />
    <rect x="336" y="142" width="24" height="54" rx="12" fill="url(#cal-ring)" stroke="#FFFFFF" stroke-width="1.5" filter="url(#cal-elem-shadow)" />

    <text x="256" y="128" font-family="-apple-system, BlinkMacSystemFont, &#39;HarmonyOS Sans&#39;, &#39;Inter&#39;, sans-serif" font-size="30" font-weight="800" letter-spacing="6" fill="#FFFFFF" text-anchor="middle" opacity="0.95">WED</text>

    <text x="256" y="362" font-family="-apple-system, BlinkMacSystemFont, &#39;HarmonyOS Sans&#39;, &#39;Inter&#39;, sans-serif" font-size="168" font-weight="800" letter-spacing="-6" fill="url(#cal-num)" text-anchor="middle" filter="url(#cal-elem-shadow)">21</text>

    <rect x="206" y="398" width="72" height="14" rx="7" fill="#FF334B" opacity="0.88" />
    <circle cx="298" cy="405" r="7" fill="#2B59FF" opacity="0.88" />
  </g>

  <!-- Outer Squircle Rim Highlight -->
  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="3" />
</svg>