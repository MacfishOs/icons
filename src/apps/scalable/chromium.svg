<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="cr-base-shadow" x="-15%" y="-10%" width="130%" height="135%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#06162E" flood-opacity="0.22" />
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#06162E" flood-opacity="0.10" />
    </filter>
    <filter id="cr-ring-shadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#002B66" flood-opacity="0.22" />
    </filter>

    <clipPath id="cr-circle-clip">
      <circle cx="256" cy="256" r="156" />
    </clipPath>

    <linearGradient id="cr-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F0F6FF" />
      <stop offset="100%" stop-color="#D9E8FF" />
    </linearGradient>

    <linearGradient id="cr-border" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#ADC8F0" stop-opacity="0.8" />
    </linearGradient>

    <!-- Top Segment: Deep Cobalt Sapphire -->
    <linearGradient id="cr-top-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2979FF" stop-opacity="0.96" />
      <stop offset="100%" stop-color="#003EB3" stop-opacity="0.92" />
    </linearGradient>

    <!-- Right Segment: Translucent Ice-Cyan Acrylic -->
    <linearGradient id="cr-right-cyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5CE1E6" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#2998FF" stop-opacity="0.92" />
    </linearGradient>

    <!-- Bottom-Left Segment: Mid Cerulean Blue -->
    <linearGradient id="cr-left-azure" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0052CC" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#38B6FF" stop-opacity="0.90" />
    </linearGradient>

    <!-- Center Sapphire Core -->
    <linearGradient id="cr-core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38B6FF" />
      <stop offset="50%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#003699" />
    </linearGradient>
  </defs>

  <!-- Full-Canvas Squircle Base (Matches VS Code 480x480 rx=110) -->
  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="url(#cr-bg)" stroke="url(#cr-border)" stroke-width="3" filter="url(#cr-base-shadow)" />

  <!-- Chromium 3-Blade Translucent Aperture -->
  <g transform="translate(256, 256) scale(1.12) translate(-256, -256)" filter="url(#cr-ring-shadow)">
    <g clip-path="url(#cr-circle-clip)">
      <!-- Bottom-Left Cerulean Segment -->
      <path d="M 100 100 L 100 412 L 256 412 L 324 190 Z" fill="url(#cr-left-azure)" />

      <!-- Right Ice-Cyan Segment -->
      <path d="M 256 190 L 412 190 L 412 412 L 188 412 Z" fill="url(#cr-right-cyan)" stroke="#FFFFFF" stroke-opacity="0.65" stroke-width="3" />

      <!-- Top Cobalt Segment -->
      <path d="M 100 100 L 412 100 L 412 190 L 188 310 L 100 160 Z" fill="url(#cr-top-blue)" stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="3" />
    </g>

    <!-- Outer Glass Rim -->
    <circle cx="256" cy="256" r="156" fill="none" stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="3" />

    <!-- Frosted White Separation Ring -->
    <circle cx="256" cy="256" r="76" fill="#FFFFFF" filter="url(#cr-ring-shadow)" />

    <!-- HarmonyOS 3D Sapphire Center Lens -->
    <circle cx="256" cy="256" r="60" fill="url(#cr-core)" />

    <!-- Lens Specular Reflection -->
    <ellipse cx="238" cy="234" rx="22" ry="12" transform="rotate(-30 238 234)" fill="#FFFFFF" opacity="0.5" />
  </g>
</svg>