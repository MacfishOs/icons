<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="tg-base-shadow" x="-15%" y="-10%" width="130%" height="135%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#051D38" flood-opacity="0.24" />
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#051D38" flood-opacity="0.12" />
    </filter>
    <filter id="tg-wing-shadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#003566" flood-opacity="0.28" />
    </filter>

    <linearGradient id="tg-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38C8FF" />
      <stop offset="50%" stop-color="#1C96E8" />
      <stop offset="100%" stop-color="#0066CC" />
    </linearGradient>

    <linearGradient id="tg-border" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A6E9FF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#004C99" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="tg-wing-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E3F4FF" />
    </linearGradient>

    <linearGradient id="tg-wing-fold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B8E6FF" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#78C6F7" stop-opacity="0.75" />
    </linearGradient>
  </defs>

  <!-- macOS Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="url(#tg-bg)" stroke="url(#tg-border)" stroke-width="3" filter="url(#tg-base-shadow)" />

  <!-- Inner Artwork Scaled & Centered to Fill Dock Slot -->
  <g transform="translate(256, 256) scale(1.132075) translate(-256, -256)">
    <circle cx="256" cy="256" r="158" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="2" />
    <g filter="url(#tg-wing-shadow)">
      <path d="M 212 292 L 222 372 C 224 382, 236 386, 244 378 L 288 332 L 352 162 L 212 292 Z" fill="url(#tg-wing-fold)" />
      <path d="M 116 250
               C 104 245, 104 228, 117 223
               L 358 130
               C 370 125, 382 136, 376 148
               L 212 292
               L 116 250 Z" fill="url(#tg-wing-top)" stroke="#FFFFFF" stroke-width="1.5" />
      <path d="M 212 292
               L 376 148
               L 342 364
               C 339 378, 322 384, 311 375
               L 212 292 Z" fill="url(#tg-wing-top)" fill-opacity="0.94" stroke="#FFFFFF" stroke-width="2" />
    </g>
  </g>
</svg>