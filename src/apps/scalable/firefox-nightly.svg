<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="ffn-base-shadow" x="-15%" y="-10%" width="130%" height="135%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#04081C" flood-opacity="0.32" />
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#04081C" flood-opacity="0.16" />
    </filter>
    <filter id="ffn-glow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#00D9FF" flood-opacity="0.28" />
    </filter>

    <linearGradient id="ffn-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111C3D" />
      <stop offset="55%" stop-color="#0A1026" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>

    <linearGradient id="ffn-border" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#0D1533" stop-opacity="0.9" />
    </linearGradient>

    <!-- Nightly Deep Violet-Cyan Core -->
    <linearGradient id="ffn-globe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#3B4BFF" />
      <stop offset="100%" stop-color="#1E0F5C" />
    </linearGradient>

    <!-- Nightly Aurora Tail (Violet -> Sapphire -> Electric Cyan-Mint) -->
    <linearGradient id="ffn-tail-main" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9B2CFF" stop-opacity="0.94" />
      <stop offset="50%" stop-color="#0088FF" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#00FFCC" stop-opacity="0.95" />
    </linearGradient>

    <!-- Secondary Translucent Cyan Petal -->
    <linearGradient id="ffn-tail-inner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#80FFEE" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#5900FF" stop-opacity="0.78" />
    </linearGradient>
  </defs>

  <!-- macOS Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="url(#ffn-bg)" stroke="url(#ffn-border)" stroke-width="3" filter="url(#ffn-base-shadow)" />

  <g filter="url(#ffn-glow)">
    <!-- Cosmic Indigo-Cyan Planet Core -->
    <circle cx="256" cy="262" r="108" fill="url(#ffn-globe)" stroke="#99F7FF" stroke-opacity="0.6" stroke-width="2" />

    <!-- Specular Shine on Globe -->
    <ellipse cx="226" cy="210" rx="52" ry="28" transform="rotate(-25 226 210)" fill="#FFFFFF" opacity="0.28" />

    <!-- HarmonyOS Aurora Fox Tail -->
    <path d="M 276 112
             C 362 122, 412 198, 398 282
             C 384 366, 306 416, 222 402
             C 138 388, 98 312, 118 228
             C 128 184, 162 152, 198 144
             C 172 178, 168 228, 194 264
             C 224 306, 286 312, 322 274
             C 350 244, 348 192, 314 162
             C 302 151, 286 144, 276 112 Z" fill="url(#ffn-tail-main)" stroke="#B3FFF5" stroke-opacity="0.7" stroke-width="2.5" />

    <!-- Secondary Translucent Aurora Crest -->
    <path d="M 332 138
             C 386 176, 404 252, 372 316
             C 340 380, 262 406, 198 378
             C 256 382, 314 344, 328 286
             C 340 236, 316 184, 332 138 Z" fill="url(#ffn-tail-inner)" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1.5" />
  </g>
</svg>