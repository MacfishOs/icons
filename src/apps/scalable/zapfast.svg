<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="zf-base-shadow" x="-15%" y="-10%" width="130%" height="135%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0E0526" flood-opacity="0.30" />
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0E0526" flood-opacity="0.15" />
    </filter>
    <filter id="zf-bolt-glow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#FF9900" flood-opacity="0.45" />
    </filter>

    <linearGradient id="zf-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B1D82" />
      <stop offset="50%" stop-color="#21104D" />
      <stop offset="100%" stop-color="#110829" />
    </linearGradient>

    <linearGradient id="zf-border" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A370FF" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#1A0C3D" stop-opacity="0.9" />
    </linearGradient>

    <!-- Translucent Cyan Speed Portal -->
    <linearGradient id="zf-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#7B2CBF" stop-opacity="0.15" />
    </linearGradient>

    <!-- HarmonyOS Golden Lightning Bolt -->
    <linearGradient id="zf-bolt-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF066" />
      <stop offset="100%" stop-color="#FF9900" />
    </linearGradient>

    <linearGradient id="zf-bolt-bottom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB833" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#FF4500" stop-opacity="0.92" />
    </linearGradient>
  </defs>

  <!-- macOS Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="url(#zf-bg)" stroke="url(#zf-border)" stroke-width="3" filter="url(#zf-base-shadow)" />

  <!-- Frosted Speed Halo Ring -->
  <circle cx="256" cy="256" r="148" fill="url(#zf-ring)" stroke="#66F7FF" stroke-opacity="0.5" stroke-width="2.5" />

  <!-- Sculpted 2-Piece HarmonyOS Lightning Bolt -->
  <g filter="url(#zf-bolt-glow)">
    <!-- Lower Bolt Blade -->
    <path d="M 228 242
             L 348 242
             C 360 242, 367 256, 359 266
             L 234 410
             C 224 422, 205 412, 210 397
             L 246 276
             H 228 Z" fill="url(#zf-bolt-bottom)" stroke="#FFE5B2" stroke-opacity="0.65" stroke-width="2" />

    <!-- Upper Overlapping Bolt Blade -->
    <path d="M 278 102
             C 288 90, 307 100, 302 115
             L 266 236
             H 284
             L 164 270
             C 152 270, 145 256, 153 246
             L 278 102 Z" fill="url(#zf-bolt-top)" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="2.5" />
  </g>
</svg>