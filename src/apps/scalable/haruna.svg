<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="hn-base-shadow" x="-15%" y="-10%" width="130%" height="135%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#001818" flood-opacity="0.30" />
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#001818" flood-opacity="0.15" />
    </filter>
    <filter id="hn-elem-shadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000F0F" flood-opacity="0.35" />
    </filter>

    <linearGradient id="hn-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00897B" />
      <stop offset="50%" stop-color="#005A50" />
      <stop offset="100%" stop-color="#002E28" />
    </linearGradient>

    <linearGradient id="hn-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#80CBC4" />
      <stop offset="100%" stop-color="#004D40" />
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="url(#hn-bg)" filter="url(#hn-base-shadow)" />

  <g transform="translate(256, 256) scale(0.76) translate(-256, -256)" filter="url(#hn-elem-shadow)">
    <!-- Video Player Screen Bezel -->
    <rect x="110" y="120" width="292" height="272" rx="42" fill="#003D33" stroke="#80CBC4" stroke-width="3" />

    <!-- Playback Triangle -->
    <path d="M 218 198 C 218 188, 228 182, 238 188 L 324 246 C 334 252, 334 264, 324 270 L 238 328 C 228 334, 218 328, 218 318 Z"
          fill="#00F5D4" stroke="#FFFFFF" stroke-width="2.5" filter="url(#hn-elem-shadow)" />

    <!-- Video Film Sprocket Holes along top -->
    <g fill="#80CBC4" opacity="0.6">
      <rect x="136" y="136" width="24" height="16" rx="4" />
      <rect x="176" y="136" width="24" height="16" rx="4" />
      <rect x="216" y="136" width="24" height="16" rx="4" />
      <rect x="256" y="136" width="24" height="16" rx="4" />
      <rect x="296" y="136" width="24" height="16" rx="4" />
      <rect x="336" y="136" width="24" height="16" rx="4" />
    </g>

    <!-- Glass Specular Reflection on Screen -->
    <ellipse cx="256" cy="190" rx="110" ry="36" fill="#FFFFFF" opacity="0.18" />
  </g>

  <!-- Outer Squircle Rim Highlight -->
  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="3" />
</svg>
