<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="sk-base-shadow" x="-15%" y="-10%" width="130%" height="135%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#020A18" flood-opacity="0.30" />
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#020A18" flood-opacity="0.15" />
    </filter>
    <filter id="sk-elem-shadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000612" flood-opacity="0.4" />
    </filter>

    <linearGradient id="sk-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#122A4E" />
      <stop offset="50%" stop-color="#0B1B33" />
      <stop offset="100%" stop-color="#040C1A" />
    </linearGradient>

    <linearGradient id="sk-fob" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3A4659" />
      <stop offset="100%" stop-color="#181F2B" />
    </linearGradient>

    <linearGradient id="sk-screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#031A26" />
      <stop offset="100%" stop-color="#000D14" />
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="url(#sk-bg)" filter="url(#sk-base-shadow)" />

  <g transform="translate(256, 256) scale(0.78) translate(-256, -256)" filter="url(#sk-elem-shadow)">
    <!-- Security Token Key Fob -->
    <rect x="108" y="120" width="296" height="272" rx="54" fill="url(#sk-fob)" stroke="#748BA8" stroke-width="3" />
    <!-- Keyring Loop Hole -->
    <circle cx="160" cy="168" r="18" fill="#0E141E" stroke="#52647C" stroke-width="2.5" />

    <!-- LCD Display Screen -->
    <rect x="144" y="214" width="224" height="116" rx="20" fill="url(#sk-screen)" stroke="#00E5FF" stroke-opacity="0.8" stroke-width="2" />

    <!-- Glowing OTP Code Characters -->
    <text x="256" y="286" font-family="monospace, monospace" font-size="44" font-weight="900" fill="#00F5D4" text-anchor="middle" letter-spacing="4">849 215</text>

    <!-- Mini Progress Bar / Time Countdown -->
    <rect x="164" y="306" width="184" height="6" rx="3" fill="#022836" />
    <rect x="164" y="306" width="138" height="6" rx="3" fill="#00E5FF" />

    <!-- Security Shield / Lock Emblem -->
    <path d="M 334 162 L 348 168 V 182 C 348 192, 334 198, 334 198 C 334 198, 320 192, 320 182 V 168 Z" fill="#00F5D4" />
  </g>

  <!-- Outer Squircle Rim Highlight -->
  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="3" />
</svg>
