<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="ex-base-shadow" x="-15%" y="-10%" width="130%" height="135%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#120428" flood-opacity="0.30" />
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#120428" flood-opacity="0.15" />
    </filter>
    <filter id="ex-elem-shadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#080214" flood-opacity="0.38" />
    </filter>

    <linearGradient id="ex-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C4DFF" />
      <stop offset="50%" stop-color="#536DFE" />
      <stop offset="100%" stop-color="#304FFE" />
    </linearGradient>

    <linearGradient id="ex-puzzle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4" />
      <stop offset="50%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#651FFF" />
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="url(#ex-bg)" filter="url(#ex-base-shadow)" />

  <g transform="translate(256, 256) scale(0.76) translate(-256, -256)" filter="url(#ex-elem-shadow)">
    <!-- 3D Frosted Puzzle Piece -->
    <path d="M 152 144 H 224 C 224 122, 238 104, 256 104 C 274 104, 288 122, 288 144 H 360 C 374 144, 384 154, 384 168 V 224 C 406 224, 424 238, 424 256 C 424 274, 406 288, 384 288 V 344 C 384 358, 374 368, 360 368 H 288 C 288 346, 274 328, 256 328 C 238 328, 224 346, 224 368 H 152 C 138 368, 128 358, 128 344 V 288 C 150 288, 168 274, 168 256 C 168 238, 150 224, 128 224 V 168 C 128 154, 138 144, 152 144 Z"
          fill="url(#ex-puzzle)" stroke="#FFFFFF" stroke-width="3" />

    <!-- Specular Highlight Curve -->
    <path d="M 156 156 H 220" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.6" />
    <circle cx="256" cy="104" r="8" fill="#FFFFFF" opacity="0.8" />
  </g>

  <!-- Outer Squircle Rim Highlight -->
  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="3" />
</svg>
